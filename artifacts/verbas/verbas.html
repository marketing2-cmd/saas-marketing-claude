<title>Verbas Contattos+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app SaaS com menu lateral escuro fixo (desktop) e barra inferior (celular); conteúdo em até 1240px; fichas em gaveta lateral. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#eef1f5; --ink:#111a2b; --muted:#5d6a7f; --line:#e2e7ee;
  --side:#0d1828; --side-2:#16243a; --side-ink:#b7c3d6; --side-hi:#ffffff;
  --accent:#0c8f63; --accent-ink:#ffffff; --accent-soft:#ddf3ea;
  --info:#2d6ae0; --info-soft:#e3ecfd;
  --amber:#b86e00; --amber-soft:#fff1d6; --amber-strong:#f5a524;
  --ok:#0c8f63; --ok-soft:#ddf3ea; --warn:#b86e00; --warn-soft:#fff1d6; --crit:#c2362b; --crit-soft:#fde4e1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111d; --surface:#111b2b; --sunk:#0d1624; --ink:#e6edf7; --muted:#93a1b5; --line:#1e2b3e;
  --side:#070d17; --side-2:#132034; --side-ink:#9fb0c7; --side-hi:#ffffff;
  --accent:#3fd19a; --accent-ink:#04231a; --accent-soft:#103426;
  --info:#7ea6f5; --info-soft:#17284a;
  --amber:#f2b34a; --amber-soft:#382811; --amber-strong:#f5a524;
  --ok:#3fd19a; --ok-soft:#103426; --warn:#f2b34a; --warn-soft:#382811; --crit:#f2766a; --crit-soft:#3e1b18;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#111b2b; --sunk:#0d1624; --ink:#e6edf7; --muted:#93a1b5; --line:#1e2b3e;
  --side:#070d17; --side-2:#132034; --side-ink:#9fb0c7; --side-hi:#ffffff;
  --accent:#3fd19a; --accent-ink:#04231a; --accent-soft:#103426;
  --info:#7ea6f5; --info-soft:#17284a;
  --amber:#f2b34a; --amber-soft:#382811; --amber-strong:#f5a524;
  --ok:#3fd19a; --ok-soft:#103426; --warn:#f2b34a; --warn-soft:#382811; --crit:#f2766a; --crit-soft:#3e1b18;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.92rem;font-weight:700}
a{color:var(--info)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* casca do app */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;
  padding-block:max(18px,env(safe-area-inset-top,0px)) 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.95rem;letter-spacing:-.03em}
.logo b{color:var(--side-hi);display:block;font-size:.98rem}
.logo small{font-size:.72rem;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .cap{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;padding:10px 10px 6px;color:#6f7f97}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:.9rem}
.nav a:hover{background:var(--side-2);color:var(--side-hi)}
.nav a.on{background:var(--side-2);color:var(--side-hi)}
.nav a.on svg{color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--side-2)}
.side-foot img{width:32px;height:32px;border-radius:50%}
.side-foot b{display:block;color:var(--side-hi);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot small{font-size:.75rem}
.side-foot div{min-width:0}
.content{min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.topbar .ttl{margin-right:auto;min-width:0}
.topbar .ttl small{color:var(--muted);font-size:.82rem}
.mbrand{display:none}
main{padding-block:22px 64px;display:flex;flex-direction:column;gap:20px}
.bnav{display:none}

/* elementos */
.banner{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--ink);color:var(--surface)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--info);border-radius:3px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi .h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;font-weight:600}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.kpi b{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:.78rem}
.gap{border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:center;background:var(--amber-soft);border:1px solid var(--amber-strong)}
.gap .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--amber)}
.gap .big{font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.02em}
.gap ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.gap li{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted)}
.gap li b{font-size:1rem;color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:10px;background:var(--sunk);cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.alert:hover{border-color:var(--line)}
.alert .ai{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--warn-soft);color:var(--warn)}
.alert.crit .ai{background:var(--crit-soft);color:var(--crit)}
.alert.info .ai{background:var(--info-soft);color:var(--info)}
.alert b{display:block;font-size:.88rem}
.alert span{font-size:.82rem;color:var(--muted)}

/* quadro */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date],input[type=month],input[type=url],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.colchips{display:none;gap:6px;overflow-x:auto;padding-bottom:4px}
.colchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;cursor:pointer}
.colchips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid var(--line)}
.col-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px 4px}
.col-h h3{font-size:.82rem}
.col-h .n{font-size:.72rem;color:var(--muted);background:var(--surface);border-radius:999px;padding:0 7px;border:1px solid var(--line)}
.col-h .t{margin-left:auto;font-size:.75rem;color:var(--muted)}
.col-h small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--info)}
.card-top{display:flex;gap:8px;align-items:baseline}
.card-top b{font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.card-top .v{margin-left:auto;font-weight:700;white-space:nowrap}
.card .sub{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* campanhas */
.cgroup{display:flex;flex-direction:column;gap:10px}
.cgroup-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cgroup-h h2{font-size:.95rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--accent)}
.ccard h3{font-size:1rem}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metrics div{display:flex;flex-direction:column;min-width:0}
.metrics span{font-size:.72rem;color:var(--muted)}
.metrics b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.layer.on{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.act.feita{background:var(--sunk)}
.act .t{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.act .m{font-size:.8rem;color:var(--muted);grid-column:1/-1;display:flex;gap:4px 12px;flex-wrap:wrap}
.act .b{display:flex;gap:6px;align-items:flex-start}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;color:var(--muted);font-weight:600;background:var(--sunk);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* gaveta */
.overlay{position:fixed;inset:0;background:rgba(7,12,20,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(700px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(880px,100%)}
.dr-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.dr-h .t{min-width:0;flex:1}
.dr-h h2{font-size:1.25rem;overflow-wrap:anywhere}
.dr-b{padding:18px 20px 48px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h3,.sec > h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:.74rem;color:var(--muted)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;list-style:none;padding:0;margin:0}
.steps li{font-size:.68rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:0}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.steps li.done::before{background:var(--accent)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur::before{background:var(--amber-strong)}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
.rule.ok{background:var(--ok-soft)} .rule.warn{background:var(--warn-soft)} .rule.crit{background:var(--crit-soft)}
.rule b{font-size:.92rem}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ck .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.ck .d svg{width:14px;height:14px}
.ck.on .d{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck b{display:block;font-size:.84rem}
.ck small{font-size:.75rem;color:var(--muted)}
.step{border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.step h3{color:var(--accent)}
.step .who{font-size:.78rem}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more summary{padding:11px 16px;cursor:pointer;font-weight:600;font-size:.88rem}
details.more > div{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem}
.hist li img{width:24px;height:24px;border-radius:50%;grid-row:span 3}
.hist .q{color:var(--muted);font-size:.76rem}
.hist ul{margin:2px 0 0;padding-left:16px;color:var(--muted)}
.links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.links a{overflow-wrap:anywhere}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:.86rem}
.mini li .v{margin-left:auto;font-weight:700}

/* formulários */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:.78rem;font-weight:600;color:var(--muted)}
.f > small{font-size:.74rem;color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fg .wide{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tipo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface)}
.tipo:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tipo b{display:block;font-size:.88rem}
.tipo small{color:var(--muted);font-size:.76rem}
.rows{display:flex;flex-direction:column;gap:6px}
.rowi{display:flex;gap:6px;align-items:center}
.rowi input{flex:1;min-width:0}
.rowi input.n{flex:0 0 80px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:3px}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;max-height:200px;overflow-y:auto;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.err{color:var(--crit);font-size:.84rem;font-weight:600}
.err:empty{display:none}
.formbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 0;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--crit);color:#fff}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--sunk);border-radius:10px}
.people img{width:28px;height:28px;border-radius:50%}
.people .nm{font-weight:600;margin-right:auto;min-width:0;overflow-wrap:anywhere}

<div class="app">

<script>
"use strict";
/* ===================== constantes ===================== */
const ANO = 2027;
const AREAS = {marketing:"Marketing", comercial:"Comercial", compras:"Compras", financeiro:"Financeiro", diretoria:"Diretoria"};
const TIPOS = {fixa:"Fixa e assinada", executada:"Executada pelo fornecedor", condicionada:"Condicionada a meta", bonificacao:"Bonificação em mercadoria"};
const TIPO_DESC = {
  fixa:"Valor garantido em acordo assinado.",
  executada:"O fornecedor paga direto o painel, os brindes ou o evento.",
  condicionada:"Só é paga se a meta de compras for batida.",
  bonificacao:"Vem em mercadoria, com nota de bonificação."};
const REGRA = {
  fixa:"Pode acontecer antes de a verba entrar",
  executada:"Pode acontecer antes de a verba entrar",
  condicionada:"Só depois de a meta ser confirmada",
  bonificacao:"Só depois de a nota de bonificação entrar"};
const FORMAS = {deposito:"Depósito", boleto:"Desconto em boleto", bonificacao:"Bonificação em mercadoria", terceiros:"Pagamento direto a terceiros"};
const MOTIVOS = {meta:"Meta não batida", desistiu:"Fornecedor desistiu", prazo:"Prazo vencido", outro:"Outro"};
const NOTAS = {bonificacao:"Nota de bonificação", debito:"Nota de débito ao fornecedor", credito:"Nota de crédito / desconto", servico:"NF de serviço (terceiro)", outra:"Outra"};
const CAMADAS = {vendedor:"Vendedor", balcao:"Cliente / balcão", eletricista:"Eletricista (Pontuei)"};
const CAMADA_DESC = {vendedor:"incentivo de sell-out", balcao:"ação de marketing", eletricista:"programa Pontuei"};
const TIPOS_ACAO = ["Tráfego pago","Painel","Blitz","Material no PDV","Pontos em dobro (Pontuei)","Incentivo de sell-out","Sorteio","Oferta relâmpago","Evento","Treinamento técnico","Premiação","Brindes","Outro"];
const PAGO = {verba:"Verba do fornecedor", fornecedor:"Fornecedor paga direto", interno:"Verba interna"};
const STATUS_C = {planejada:["Planejada","info"], andamento:["Em andamento","warn"], concluida:["Concluída","ok"], cancelada:["Cancelada",""]};
const COLS = [
  {k:"negociada", n:"Negociada", a:"Comercial ou Compras"},
  {k:"formalizada", n:"Formalizada", a:"Comercial"},
  {k:"apuracao", n:"Em apuração", a:"Compras"},
  {k:"confirmada", n:"Confirmada", a:"Comercial"},
  {k:"recebida", n:"Recebida", a:"Financeiro"},
  {k:"executada", n:"Executada", a:"Marketing"},
  {k:"comprovada", n:"Comprovada", a:"Marketing"},
  {k:"perdida", n:"Perdida", a:"Com motivo"}];
const COLN = Object.fromEntries(COLS.map(c=>[c.k,c.n]));
const ORDEM = {negociada:1, formalizada:2, apuracao:3, confirmada:4, recebida:5};
const PODE = {
  criar:["marketing","comercial","compras"], editar:["marketing","comercial","compras"],
  formalizar:["marketing","comercial"], apuracao:["marketing","compras"], realizado:["marketing","compras","comercial"],
  confirmar:["marketing","comercial"], receber:["marketing","financeiro"], executar:["marketing"], comprovar:["marketing"],
  perder:["marketing","comercial","compras"], corrigir:["marketing"], config:["marketing"],
  repasse:["marketing","compras"], nota:["marketing","financeiro"], campanha:["marketing"]};
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const IC = {
  painel:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  verbas:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1.2"/>',
  campanhas:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 8a5 5 0 0 1 0 8"/><path d="M18 5a9 9 0 0 1 0 14"/>',
  fornecedores:'<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/>',
  config:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  alerta:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  tarefa:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  promessa:'<path d="M4 12h16M12 4v16"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  entrada:'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
  uso:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6"/>'};
const ico=(k,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ===================== estado ===================== */
const S = {
  db:null, user:null, uid:null, me:null, isOwner:false, canWrite:null, noDb:false,
  fornecedores:[], ciclos:[], verbas:[], campanhas:[], equipe:{}, pedidos:{}, feed:[], prof:{},
  ok:{}, slow:false, view:"painel",
  fil:{forn:"", ciclo:"", tipo:"", area:""}, col:"negociada", fornBusca:"", fornFaixa:"", campFil:"",
  modal:null, dirty:false, histV:[], histUnsub:null, ownerSelfDone:false, acaoEdit:null
};

/* ===================== utilidades ===================== */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const fmt0 = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
function brl(n){return fmt0.format(Number(n)||0)}
function brlK(n){n=Number(n)||0;const a=Math.abs(n);
  if(a>=1e6) return "R$ "+(n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";
  if(a>=1e3) return "R$ "+Math.round(n/1e3).toLocaleString("pt-BR")+" mil";
  return brl(n)}
function num(s){if(typeof s==="number")return s;s=String(s||"").replace(/[R$\s%]/g,"");if(!s)return 0;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/\.(?=\d{3}(\D|$))/g,"");
  const n=parseFloat(s);return isFinite(n)?n:0}
function inMoney(n){return n?Number(n).toLocaleString("pt-BR",{maximumFractionDigits:2}):""}
function hoje(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dBR(iso){if(!iso)return "—";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m+"/"+y}
function dhBR(iso){if(!iso)return "";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function dias(a,b){return Math.round((Date.parse(String(b).slice(0,10))-Date.parse(String(a).slice(0,10)))/864e5)}
function fimTrimestre(iso){const [y,m,d]=iso.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1+3,d));dt.setUTCDate(dt.getUTCDate()-1);return dt.toISOString().slice(0,10)}
function mesBR(ym){if(!ym)return "";const [y,m]=ym.split("-");return MESES[+m-1]+"/"+y}
function faixaDe(v){v=+v||0;return v>=1e6?"A":v>=3e5?"B":v>=1e5?"C":"—"}
function safeUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function rid(){return Math.random().toString(36).slice(2,10)}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function toast(msg,bad){const t=$("#toast");t.innerHTML=`<div class="toast${bad?" bad":""}" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",bad?6000:2600)}
function errMsg(e){const c=e&&e.code;
  if(c==="invalid_argument")return "Não foi possível salvar: seu acesso não permite esta alteração. Fale com a gestora de marketing.";
  if(c==="quota_exceeded")return "O banco de dados está cheio. Fale com a gestora de marketing.";
  if(c==="resource_exhausted")return "Muitas alterações seguidas. Espere alguns segundos e tente de novo.";
  return "Não foi possível salvar agora. Verifique a conexão e tente de novo."}

/* ===================== dados derivados ===================== */
const forn = id=>S.fornecedores.find(f=>f.id===id);
const ciclo = id=>S.ciclos.find(c=>c.id===id);
const verba = id=>S.verbas.find(v=>v.id===id);
const camp = id=>S.campanhas.find(c=>c.id===id);
function fornNome(id){const f=forn(id);return f?f.nome:"Fornecedor removido"}
function cicloNome(id){const c=ciclo(id);if(!c)return "Sem ciclo";return "Ciclo "+c.numero+" · "+MESES[+c.inicio.slice(5,7)-1]+"–"+MESES[+c.fim.slice(5,7)-1]}
function verbaNome(v){if(!v)return "verba";return fornNome(v.fornecedorId)+(v.titulo?" · "+v.titulo:"")+" ("+brlK(v.valorPrometido)+")"}
function realizado(v){return (v.realizados||[]).reduce((s,r)=>s+(+r.valor||0),0)}
function temMeta(v){return v.tipo==="condicionada"||(+v.meta>0)}
function liberado(v){
  const fx=+v.parteFixa||0, vr=+v.parteVariavel||0, base=(fx||vr)?null:(+v.valorPrometido||0);
  if(!(+v.meta>0)) return base??(fx+vr);
  const at=realizado(v)/v.meta*100;
  const ds=(v.degraus||[]).filter(d=>+d.pct>0).sort((a,b)=>a.pct-b.pct);
  let lib=0; if(ds.length){for(const d of ds) if(at>=+d.pct) lib=+d.libera||0;} else lib=at>=100?100:0;
  return base!=null? base*lib/100 : fx+vr*lib/100}
function esperado(v){return +v.valorConfirmado||+v.valorPrometido||0}
function disponivel(v){return v.etapa==="recebida"?(+v.valorRecebido||0):v.etapa==="perdida"?0:esperado(v)}
function notaBonif(v){return (v.notas||[]).some(n=>n.tipo==="bonificacao")}
function permitida(v){
  if(v.tipo==="fixa"||v.tipo==="executada") return true;
  if(v.tipo==="condicionada") return v.etapa==="confirmada"||v.etapa==="recebida";
  if(v.tipo==="bonificacao") return v.etapa==="recebida"||notaBonif(v);
  return false}
function adiant(v){return !!(v.adiantamento&&v.adiantamento.marcado)}
function coluna(v){if(v.etapa==="perdida")return "perdida";if(v.comprovadaEm)return "comprovada";if(v.executadaEm)return "executada";return v.etapa||"negociada"}
function anoDe(v){const c=ciclo(v.cicloId);if(c)return c.ano;const d=v.previsaoEntrada||v.dataCampanha;return d?+d.slice(0,4):ANO}
/* uso da verba = ações de campanha pagas com ela */
function usos(v){const out=[];for(const c of S.campanhas)for(const a of (c.acoes||[]))if(a.pagoPor==="verba"&&a.verbaId===v.id)out.push({c,a});return out}
function usado(v){return usos(v).filter(x=>x.a.status==="feita").reduce((s,x)=>s+(+x.a.custo||0),0)}
function planejadoV(v){return usos(v).filter(x=>x.a.status!=="feita").reduce((s,x)=>s+(+x.a.custo||0),0)}
function campMetricas(c){
  const vs=(c.verbaIds||[]).map(verba).filter(Boolean);
  const disp=vs.reduce((s,v)=>s+disponivel(v),0);
  const ac=c.acoes||[];
  const custo=ac.reduce((s,a)=>s+(+a.custo||0),0);
  const usadoV=ac.filter(a=>a.status==="feita"&&a.pagoPor==="verba").reduce((s,a)=>s+(+a.custo||0),0);
  const feitas=ac.filter(a=>a.status==="feita").length;
  return {vs,disp,custo,usadoV,saldo:disp-usadoV,feitas,total:ac.length}}
function statusCampanha(v){
  if(v.etapa==="perdida") return {c:"", t:"Verba perdida"};
  if(v.comprovadaEm) return {c:"ok", t:"Contrapartida comprovada"};
  if(v.executadaEm) return {c:"info", t:"Campanha executada"};
  if(permitida(v)) return {c:"ok", t:"Campanha liberada"};
  if(adiant(v)) return {c:"warn", t:"Adiantamento: risco assumido"};
  return {c:"crit", t:v.tipo==="bonificacao"?"Campanha só após a nota":"Campanha só após a meta"}}

function pendencias(v){
  const out=[]; if(v.etapa==="perdida") return out;
  const e=v.etapa, f=forn(v.fornecedorId)||{};
  if(e==="negociada") out.push({area:"comercial", t:"Anexar o acordo e formalizar"});
  if(f.distribuidor && !v.repasse && ORDEM[e]<=2) out.push({area:"compras", t:"Registrar o repasse negociado com o fabricante"});
  if(e==="formalizada"){ if(temMeta(v)) out.push({area:"compras", t:"Iniciar a apuração da meta"}); else out.push({area:"comercial", t:"Confirmar a liberação da verba"}); }
  else if(e==="apuracao"){
    const ult=(v.realizados||[]).map(r=>r.mes).sort().pop()||"";
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const mp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    if(ult<mp) out.push({area:"compras", t:"Lançar o realizado de "+mesBR(mp)});
    if(+v.meta>0 && realizado(v)>=v.meta) out.push({area:"comercial", t:"Meta batida: confirmar a verba"});
    else if(v.apuracaoFim && v.apuracaoFim<hoje()) out.push({area:"comercial", t:"Apuração encerrada: confirmar ou marcar como perdida"});
  }
  else if(e==="confirmada") out.push({area:"financeiro", t:v.tipo==="bonificacao"&&!notaBonif(v)?"Registrar a nota de bonificação":"Registrar a entrada da verba"});
  if(!v.executadaEm && permitida(v)) out.push({area:"marketing", t:"Usar a verba em uma campanha"});
  if(v.executadaEm && !v.comprovadaEm) out.push({area:"marketing", t:"Enviar o relatório de contrapartida"});
  return out}
function pendCampanhas(){
  const out=[], t=hoje();
  for(const c of S.campanhas){ if(c.status==="cancelada") continue;
    for(const a of (c.acoes||[])) if(a.status!=="feita"&&a.data&&a.data<t) out.push({c,a,t:"Ação com data vencida: marcar como feita ou reagendar"});
    if(c.status!=="concluida"&&c.fim&&c.fim<t&&!(c.resultados&&+c.resultados.vendasCiclo)) out.push({c,t:"Lançar o resultado de vendas do ciclo"});
  }
  return out}

function alertas(){
  const out=[], t=hoje();
  for(const v of S.verbas){
    if(v.etapa==="perdida") continue;
    if(v.etapa==="apuracao" && +v.meta>0 && v.apuracaoInicio && v.apuracaoFim){
      const tot=Math.max(1,dias(v.apuracaoInicio,v.apuracaoFim)), dec=dias(v.apuracaoInicio,t), frac=Math.min(1,dec/tot);
      if(frac>=.5){const esp=v.meta*frac, r=realizado(v);
        if(r<esp) out.push({sev:frac>=1?"crit":"warn", v, titulo:frac>=1?"Apuração encerrada abaixo da meta":"Meta em risco",
          texto:`Realizado ${brl(r)}, esperado ${brl(esp)} até hoje. ${pct(r,v.meta)}% da meta com ${Math.round(frac*100)}% do período.`});}
    }
    if(v.etapa==="confirmada" && v.previsaoEntrada && v.previsaoEntrada<t)
      out.push({sev:"crit", v, titulo:"Verba confirmada não entrou", texto:`Previsão era ${dBR(v.previsaoEntrada)}: ${dias(v.previsaoEntrada,t)} dias de atraso.`});
    if(!permitida(v) && !adiant(v)){
      if(!v.executadaEm && v.dataCampanha) out.push({sev:"warn", v, titulo:"Campanha marcada antes de a verba ser permitida", texto:`Campanha em ${dBR(v.dataCampanha)}. Regra: ${REGRA[v.tipo].toLowerCase()}.`});
      else if(planejadoV(v)>0) out.push({sev:"warn", v, titulo:"Ações planejadas com verba ainda não liberada", texto:`${brl(planejadoV(v))} em ações. Regra: ${REGRA[v.tipo].toLowerCase()}.`});
    }
    if(v.executadaEm && !v.comprovadaEm && dias(v.executadaEm,t)>15)
      out.push({sev:"warn", v, titulo:"Campanha sem relatório de contrapartida", texto:`Executada em ${dBR(v.executadaEm)}, há ${dias(v.executadaEm,t)} dias.`});
    const u=usado(v), d=disponivel(v);
    if(u>d+0.5) out.push({sev:"crit", v, titulo:"Uso acima da verba", texto:`Marketing usou ${brl(u)} de ${brl(d)} disponíveis.`});
  }
  return out.sort((a,b)=>(a.sev==="crit"?0:1)-(b.sev==="crit"?0:1))}

/* ===================== pessoas ===================== */
function area(){const e=S.equipe[S.uid];if(e&&e.area)return e.area;return S.isOwner?"marketing":null}
function pode(a){return S.canWrite!==false && !!S.db && PODE[a].includes(area())}
function nome(id){if(!id)return "—";const p=S.prof[id];return (p&&p.name)||(id===S.uid?"Você":"Pessoa sem nome")}
function avatar(id){const p=S.prof[id];return p?p.avatarUrl:""}
async function ensureProfiles(ids){
  if(!S.user) return;
  const miss=[...new Set(ids.filter(x=>typeof x==="string"&&x))].filter(id=>!(id in S.prof));
  if(!miss.length) return;
  miss.forEach(id=>S.prof[id]=null);
  try{const ps=await S.user.profiles(miss);Object.assign(S.prof,ps);}catch(e){}
  renderAll()}
function idsVisiveis(){
  const ids=[S.uid,...Object.keys(S.equipe),...Object.keys(S.pedidos)];
  for(const v of S.verbas){ids.push(v.criadoPor,v.atualizadoPor);Object.values(v.responsaveis||{}).forEach(x=>ids.push(x));if(v.adiantamento)ids.push(v.adiantamento.por);if(v.repasse)ids.push(v.repasse.por);(v.notas||[]).forEach(n=>ids.push(n.por));}
  for(const c of S.campanhas){ids.push(c.responsavel,c.criadoPor);}
  S.feed.forEach(h=>ids.push(h.por));S.histV.forEach(h=>ids.push(h.por));
  return ids}
function membros(ar){return Object.entries(S.equipe).filter(([,e])=>e.area===ar).map(([id])=>id)}

/* ===================== gravação ===================== */
async function addHist(verbaId, acao, detalhes, alvo, campanhaId){
  try{await S.db.collection("historico").add({verbaId:verbaId||"", campanhaId:campanhaId||"", alvo:alvo||"", em:new Date().toISOString(), por:S.uid||"", acao, detalhes:detalhes||[]});}catch(e){}
}
async function salvarVerba(id, patch, acao, detalhes){
  patch.atualizadoEm=new Date().toISOString(); patch.atualizadoPor=S.uid||"";
  await S.db.doc("verbas/"+id).update(patch);
  await addHist(id, acao, detalhes);
}
async function salvarCamp(id, patch, acao, detalhes){

async function boot(){
  route(); renderAll();
  window.addEventListener("hashchange",()=>{route();renderHeader();renderMain();window.scrollTo(0,0);});
  const c=window.claude;
  if(!c||!c.use){S.noDb=true;renderAll();return;}
  const timer=setTimeout(()=>{S.slow=true;renderMain();},10000);
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  S.db=db; S.user=user;
  if(user){
    const me=await user.me(); S.me=me; S.uid=me.id; S.isOwner=me.isOwner;
    try{S.canWrite=await user.can("data.write");}catch(e){S.canWrite=null}
  }
  if(!db){clearTimeout(timer);S.noDb=true;renderAll();return;}
  const done=k=>{S.ok[k]=true;if(["fornecedores","ciclos","verbas","equipe"].every(x=>S.ok[x])){clearTimeout(timer);S.slow=false;}};
  const onErr=k=>e=>{done(k);if(e&&e.code!=="revoked")toast("Não foi possível carregar "+k+". Recarregue a página.",true);renderAll();};
  db.collection("fornecedores").onSnapshot(s=>{S.fornecedores=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.compras2026||0)-(a.compras2026||0));if(!s.metadata.fromCache)done("fornecedores");renderAll();},onErr("fornecedores"));
  db.collection("ciclos").onSnapshot(s=>{S.ciclos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ano-b.ano)||(a.numero-b.numero));if(!s.metadata.fromCache)done("ciclos");renderAll();},onErr("ciclos"));
  db.collection("verbas").onSnapshot(s=>{S.verbas=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)done("verbas");afterData();},onErr("verbas"));
  db.collection("campanhas").onSnapshot(s=>{S.campanhas=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)done("campanhas");afterData();},onErr("campanhas"));
  db.collection("equipe").onSnapshot(s=>{S.equipe=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(!s.metadata.fromCache){done("equipe");ownerSelf();}afterData();},onErr("equipe"));
  db.collection("pedidos").onSnapshot(s=>{S.pedidos=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));afterData();},()=>{});
  db.collection("historico").orderBy("em","desc").limit(40).onSnapshot(s=>{S.feed=s.docs.map(d=>({id:d.id,...d.data()}));afterData();},()=>{});
}

function niceMax(m){if(m<=0)return 1;const p=10**Math.floor(Math.log10(m)),f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chartHtml(vs){
  const prev=Array(12).fill(0), rec=Array(12).fill(0);
  for(const v of vs){
    if(v.etapa!=="perdida"&&v.previsaoEntrada&&+v.previsaoEntrada.slice(0,4)===ANO) prev[+v.previsaoEntrada.slice(5,7)-1]+=esperado(v);

  const top=niceMax(mx), W=640, H=230, L=64, B=26, T=10, cw=(W-L-8)/12, bw=Math.min(16,cw/2-3);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g="";
  [0,.5,1].forEach(f=>{const yy=y(top*f);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(brlK(top*f))}</text>`;});
  const tm=new Date().getFullYear()===ANO?new Date().getMonth():-1;
  for(let i=0;i<12;i++){
    const cx=L+cw*i+cw/2;
    if(prev[i]>0){const yy=y(prev[i]);g+=`<rect x="${cx-bw-1}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="3" fill="var(--info-soft)" stroke="var(--info)" stroke-width="1.2"><title>${MESES[i]}: previsto ${brl(prev[i])}</title></rect>`;}
    if(rec[i]>0){const yy=y(rec[i]);g+=`<rect x="${cx+1}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="3" fill="var(--accent)"><title>${MESES[i]}: recebido ${brl(rec[i])}</title></rect>`;}
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${i===tm?"var(--ink)":"var(--muted)"}" font-weight="${i===tm?700:400}">${MESES[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Previsto e recebido por mês">${g}</svg>`}

function abrirModal(m){S.modal=m;S.dirty=false;S.acaoEdit=null;

  const campo=m.tipo==="verba"?"verbaId":m.tipo==="camp"?"campanhaId":null;
  if(campo&&S.db){S.histUnsub=S.db.collection("historico").where(campo,"==",m.id).onSnapshot(s=>{S.histV=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.em.localeCompare(a.em));const el=$("#histV");if(el)el.innerHTML=histList(S.histV,false);ensureProfiles(S.histV.map(h=>h.por));},()=>{});}

function renderModal(){
  const m=S.modal;if(!m){$("#modal").innerHTML="";return}
  let head="",body="",wide=false;
  if(m.tipo==="verba"){const v=verba(m.id);if(!v){head=`<div class="t"><h2>Verba não encontrada</h2></div>`;body=`<div class="empty">Esta verba foi excluída.</div>`;}else [head,body]=verbaView(v);}
  else if(m.tipo==="verbaForm") [head,body]=verbaForm(m.id?verba(m.id):null);
  else if(m.tipo==="camp"){wide=true;const c=camp(m.id);if(!c){head=`<div class="t"><h2>Campanha não encontrada</h2></div>`;body=`<div class="empty">Esta campanha foi excluída.</div>`;}else [head,body]=campView(c);}
  else if(m.tipo==="campForm"){wide=true;[head,body]=campForm(m.id?camp(m.id):null,m.ciclo);}
  else if(m.tipo==="forn") [head,body]=fornForm(m.id?forn(m.id):null);
  else if(m.tipo==="ciclo") [head,body]=cicloForm(ciclo(m.id));
  const keepScroll=$(".drawer")?$(".drawer").scrollTop:0;
  $("#modal").innerHTML=`<div class="overlay" data-act="fecharFora"><div class="drawer${wide?" wide":""}" role="dialog" aria-modal="true"><div class="dr-h">${head}<button class="btn ghost" data-act="fechar" aria-label="Fechar">✕</button></div><div class="dr-b">${body}</div></div></div>`;
  document.body.style.overflow="hidden";

}

      `<div class="fg"><label class="f"><span>Início da apuração</span><input type="date" name="ini" value="${esc(v.apuracaoInicio||"")}" required></label><label class="f"><span>Fim da apuração</span><input type="date" name="fim" value="${esc(v.apuracaoFim||"")}"><small>Vazio = 3 meses após o início</small></label><label class="f"><span>Meta (R$)</span><input type="text" inputmode="decimal" name="meta" value="${inMoney(v.meta)}" required></label></div><div><button class="btn pri" data-step-act="apuracao" data-id="${v.id}">Iniciar apuração</button></div>`);
    else h+=confirmBox(v,"Confirmar a liberação da verba",esperado(v));
  }
  if(e==="apuracao"){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    h+=box("Lançar o realizado do mês","Compras",pode("realizado"),
      `<div class="fg"><label class="f"><span>Mês</span><input type="month" name="mes" value="${ym}" required></label><label class="f"><span>Compras no mês (R$)</span><input type="text" inputmode="decimal" name="valor" required placeholder="0"></label></div><div class="muted small">Se o mês já tiver valor, ele é substituído.</div><div><button class="btn pri" data-step-act="realizado" data-id="${v.id}">Lançar realizado</button></div>`);

      `<div class="fg"><label class="f"><span>Data real de entrada</span><input type="date" name="data" value="${hoje()}" required></label><label class="f"><span>Valor recebido (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(esperado(v))}" required></label>
      <label class="f"><span>Forma de recebimento</span><select name="forma" required>${Object.entries(FORMAS).map(([k,n])=>`<option value="${k}" ${v.formaRecebimento===k?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f"><span>Número da nota ${v.tipo==="bonificacao"?"de bonificação":"(se houver)"}</span><input type="text" name="numero"></label></div>
      <div><button class="btn pri" data-step-act="receber" data-id="${v.id}">Confirmar recebimento</button></div>`);
  }
  if(!v.executadaEm){
    const precisa=!permitida(v)&&!adiant(v);
    h+=box("Executar a campanha","Marketing",pode("executar"),
      `<div class="small muted">O caminho recomendado é registrar as ações em Campanhas: a primeira ação feita com esta verba já marca a execução. Use abaixo só se a campanha não tiver ações cadastradas.</div>
      <label class="f" style="max-width:220px"><span>Data em que a campanha aconteceu</span><input type="date" name="data" value="${hoje()}" required></label>
      ${precisa?`<div class="rule warn"><b>A regra ainda não permite esta campanha</b><span class="small">${esc(REGRA[v.tipo])}. Para fazer antes, marque o adiantamento e diga quem aprovou.</span>
        <label class="check"><input type="checkbox" name="adiant"> Adiantamento com verba interna — risco assumido</label>
        <label class="f"><span>Quem aprovou</span><input type="text" name="aprov" placeholder="Nome de quem aprovou"></label></div>`:""}
      <div><button class="btn" data-step-act="executar" data-id="${v.id}">Marcar campanha como executada</button></div>`);
  } else if(!v.comprovadaEm){
    h+=box("Enviar o relatório de contrapartida","Marketing",pode("comprovar"),
      `<div class="fg"><label class="f"><span>Data de envio ao fornecedor</span><input type="date" name="data" value="${hoje()}" required></label><label class="f"><span>Link do relatório (opcional)</span><input type="url" name="link" placeholder="https://"></label></div><div><button class="btn pri" data-step-act="comprovar" data-id="${v.id}">Marcar relatório como enviado</button></div>`);
  }
  return h}
function confirmBox(v,titulo,sug){

    <div class="fg"><label class="f"><span>Valor confirmado (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(sug)}" required><small>${temMeta(v)?"Sugestão pelo realizado e degraus: "+brl(liberado(v)):"Valor prometido: "+brl(v.valorPrometido)}</small></label>

const degRow=d=>`<div class="rowi"><input class="n" type="text" inputmode="decimal" data-k="pct" value="${esc(d.pct??"")}" aria-label="% da meta"><span class="muted small">% da meta libera</span><input class="n" type="text" inputmode="decimal" data-k="libera" value="${esc(d.libera??"")}" aria-label="% liberado"><span class="muted small">%</span><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
const cpRow=c=>`<div class="rowi"><input type="text" data-k="texto" value="${esc(c.texto||"")}" placeholder="Ex.: 2 painéis na loja por 60 dias"><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
const lkRow=l=>`<div class="rowi"><input type="text" data-k="titulo" value="${esc(l.titulo||"")}" placeholder="Descrição" style="flex:0 1 35%"><input type="url" data-k="url" value="${esc(l.url||"")}" placeholder="https://"><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
function atualizaForm(f){
  const tipo=(f.querySelector("[name=tipo]:checked")||{}).value;
  const fx=num(f.parteFixa.value), vr=num(f.parteVariavel.value), pr=num(f.valorPrometido.value);
  $("#somaPartes").textContent=(fx||vr)?(Math.abs(fx+vr-pr)>0.5?`Atenção: fixa + variável = ${brl(fx+vr)}, diferente do prometido (${brl(pr)}).`:`Fixa + variável = ${brl(fx+vr)}.`):"";
  $("#secMeta").style.display=(tipo==="condicionada"||num(f.meta.value)>0||!tipo)?"":"none";
  const box=$("#adiantBox");const a=f._adiant;
  if(tipo==="condicionada"||tipo==="bonificacao"){
    if(!box.dataset.on){box.dataset.on="1";box.innerHTML=`<div class="rule warn" style="margin-top:10px"><b>Campanha antes da verba?</b><span class="small" id="adTxt"></span>
      <label class="check"><input type="checkbox" name="adiant" ${a&&a.marcado?"checked":""}> Adiantamento com verba interna — risco assumido</label>
      <label class="f"><span>Quem aprovou</span><input type="text" name="aprov" value="${esc(a&&a.aprovadoPor||"")}" placeholder="Nome de quem aprovou"></label></div>`;}
    $("#adTxt").textContent="Regra deste tipo: "+REGRA[tipo].toLowerCase()+". Se a campanha vai acontecer antes, marque abaixo e diga quem aprovou.";
  } else {box.dataset.on="";box.innerHTML="";}

function lerRows(id,map){return $$("#"+id+" .rowi").map(r=>{const o={};$$("input",r).forEach(i=>o[i.dataset.k]=i.value.trim());return map(o)}).filter(Boolean)}
const CAMPOS={fornecedorId:["Fornecedor","forn"],cicloId:["Ciclo","ciclo"],titulo:["Campanha","txt"],tipo:["Tipo de verba","tipo"],valorPrometido:["Valor prometido","brl"],parteFixa:["Parte fixa","brl"],parteVariavel:["Parte variável","brl"],meta:["Meta","brl"],apuracaoInicio:["Início da apuração","data"],apuracaoFim:["Fim da apuração","data"],regraTexto:["Regra da meta","txt"],degraus:["Degraus","deg"],formaRecebimento:["Forma de recebimento","forma"],previsaoEntrada:["Previsão de entrada","data"],dataCampanha:["Data da campanha","data"],adiantamento:["Adiantamento","adiant"],responsaveis:["Responsáveis","resp"],contrapartidas:["Contrapartidas","cp"],links:["Links do acordo","lk"]};
function fmtCampo(t,x){switch(t){case"brl":return brl(x);case"data":return dBR(x);case"forn":return fornNome(x);case"ciclo":return x?cicloNome(x):"Sem ciclo";case"tipo":return TIPOS[x]||"—";case"forma":return FORMAS[x]||"—";
  case"deg":return (x||[]).map(d=>d.pct+"% → "+d.libera+"%").join("; ")||"—";case"cp":return (x||[]).map(c=>c.texto).join("; ")||"—";case"lk":return (x||[]).length+" link(s)";
  case"adiant":return x&&x.marcado?"marcado, aprovado por "+x.aprovadoPor:"não";default:return x||"—"}}
function isEmpty(x){return x==null||x===""||x===0||(Array.isArray(x)&&!x.length)}
async function salvarVerbaForm(f){
  const err=$("#fErr");err.textContent="";
  const id=f.dataset.id, old=id?verba(id):null;
  const tipo=(f.querySelector("[name=tipo]:checked")||{}).value||"";
  const d={
    fornecedorId:f.fornecedorId.value, cicloId:f.cicloId.value, titulo:f.titulo.value.trim(), tipo,
    valorPrometido:num(f.valorPrometido.value), parteFixa:num(f.parteFixa.value), parteVariavel:num(f.parteVariavel.value),
    meta:num(f.meta.value), apuracaoInicio:f.apuracaoInicio.value, apuracaoFim:f.apuracaoFim.value, regraTexto:f.regraTexto.value.trim(),
    degraus:lerRows("rowsDeg",o=>(num(o.pct)>0?{pct:num(o.pct),libera:num(o.libera)}:null)),
    formaRecebimento:f.formaRecebimento.value, previsaoEntrada:f.previsaoEntrada.value, dataCampanha:f.dataCampanha.value,
    responsaveis:Object.fromEntries(["comercial","compras","financeiro","marketing"].map(a=>[a,f["resp_"+a].value])),
    contrapartidas:lerRows("rowsCp",o=>o.texto?{texto:o.texto,entregue:!!((old&&old.contrapartidas||[]).find(c=>c.texto===o.texto)||{}).entregue}:null),
    links:lerRows("rowsLk",o=>o.url?{titulo:o.titulo,url:safeUrl(o.url)}:null)
  };
  if(!d.fornecedorId) return err.textContent="Escolha o fornecedor.";
  if(!d.tipo) return err.textContent="Escolha o tipo de verba.";
  if(!(d.valorPrometido>0)) return err.textContent="Informe o valor prometido.";
  if(d.apuracaoInicio&&!d.apuracaoFim) d.apuracaoFim=fimTrimestre(d.apuracaoInicio);
  if(d.apuracaoInicio&&d.apuracaoFim<d.apuracaoInicio) return err.textContent="O fim da apuração está antes do início.";
  if(!d.dataCampanha&&d.cicloId){const c=ciclo(d.cicloId);if(c)d.dataCampanha=c.inicio;}
  const ad=f.querySelector("[name=adiant]");
  if(ad){
    if(ad.checked){const ap=f.aprov.value.trim();if(!ap)return err.textContent="Diga quem aprovou o adiantamento com verba interna.";
      const prev=old&&old.adiantamento;d.adiantamento=(prev&&prev.marcado&&prev.aprovadoPor===ap)?prev:{marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};}
    else d.adiantamento=null;
  } else d.adiantamento=old?old.adiantamento||null:null;
  const btn=f.querySelector("[type=submit]");btn.disabled=true;
  try{
    const now=new Date().toISOString();
    if(!old){
      const ref=S.db.collection("verbas").doc();
      await ref.set({...d,etapa:"negociada",realizados:[],notas:[],criadoEm:now,criadoPor:S.uid||"",atualizadoEm:now,atualizadoPor:S.uid||""});
      await addHist(ref.id,"cadastrou a verba (Negociada)",[`${fornNome(d.fornecedorId)} · ${TIPOS[d.tipo]} · ${brl(d.valorPrometido)}`]);
      toast("Verba cadastrada");S.dirty=false;abrirModal({tipo:"verba",id:ref.id});
    } else {
      const patch={},det=[];
      for(const k of Object.keys(d)){const a=JSON.stringify(old[k]??null),b=JSON.stringify(d[k]??null);
        if(a!==b && !(isEmpty(old[k])&&isEmpty(d[k]))){patch[k]=d[k];const [lb,t]=CAMPOS[k]||[k,"txt"];det.push(t==="resp"?"Responsáveis alterados":`${lb}: ${fmtCampo(t,old[k])} → ${fmtCampo(t,d[k])}`);}}
      if(!det.length){toast("Nada foi alterado");S.dirty=false;abrirModal({tipo:"verba",id});return;}
      await salvarVerba(id,patch,"editou a verba",det);
      toast("Alterações salvas");S.dirty=false;abrirModal({tipo:"verba",id});
    }
  }catch(e){btn.disabled=false;err.textContent=errMsg(e);}
}

/* ---------- passos da verba ---------- */
async function passo(act,id,form){
  const v=verba(id);if(!v)return;
  const g=n=>{const el=form.querySelector(`[name=${n}]`);return el?(el.type==="checkbox"?el.checked:el.value.trim()):""};
  const falha=m=>{toast(m,true)};
  try{
    if(act==="formalizar"){if(!(v.links||[]).length)return falha("Anexe o link do acordo antes de formalizar.");
      await salvarVerba(id,{etapa:"formalizada",formalizadaEm:hoje()},"formalizou a verba",["Etapa: Negociada → Formalizada"]);}
    else if(act==="apuracao"){const ini=g("ini");let fim=g("fim");const meta=num(g("meta"));
      if(!ini||!(meta>0))return falha("Informe o início da apuração e a meta.");
      if(!fim)fim=fimTrimestre(ini);if(fim<ini)return falha("O fim da apuração está antes do início.");
      await salvarVerba(id,{etapa:"apuracao",apuracaoInicio:ini,apuracaoFim:fim,meta},"iniciou a apuração",[`Etapa: Formalizada → Em apuração`,`Meta ${brl(meta)} de ${dBR(ini)} a ${dBR(fim)}`]);}
    else if(act==="realizado"){const mes=g("mes"),val=num(g("valor"));if(!mes)return falha("Escolha o mês.");
      const l=(v.realizados||[]).filter(r=>r.mes!==mes);const ant=(v.realizados||[]).find(r=>r.mes===mes);l.push({mes,valor:val});
      await salvarVerba(id,{realizados:l},"lançou realizado",[`${mesBR(mes)}: ${ant?brl(ant.valor)+" → ":""}${brl(val)}`]);}
    else if(act==="confirmar"){const val=num(g("valor")),prev=g("prev");if(!(val>0))return falha("Informe o valor confirmado.");if(!prev)return falha("Informe a previsão de entrada.");
      await salvarVerba(id,{etapa:"confirmada",valorConfirmado:val,previsaoEntrada:prev,confirmadaEm:hoje()},"confirmou a verba",[`Etapa: ${COLN[v.etapa]} → Confirmada`,`Valor confirmado ${brl(val)}, previsão ${dBR(prev)}`]);}
    else if(act==="receber"){const data=g("data"),val=num(g("valor")),forma=g("forma"),numero=g("numero");if(!data||!(val>0))return falha("Informe a data e o valor recebido.");
      if(v.tipo==="bonificacao"&&!numero&&!notaBonif(v))return falha("Informe o número da nota de bonificação.");
      const patch={etapa:"recebida",dataEntrada:data,valorRecebido:val,formaReal:forma};const det=[`Etapa: Confirmada → Recebida`,`${brl(val)} em ${dBR(data)} por ${FORMAS[forma]}`];
      if(numero){patch.notas=[...(v.notas||[]),{tipo:v.tipo==="bonificacao"?"bonificacao":forma==="boleto"?"credito":"outra",numero,data,valor:val,link:"",por:S.uid||"",em:new Date().toISOString()}];det.push("Nota nº "+numero);}
      await salvarVerba(id,patch,"registrou a entrada",det);}
    else if(act==="repasse"){const data=g("data");if(!data)return falha("Informe a data da negociação.");
      const r={data,valor:num(g("valor")),fabricante:g("fab"),obs:g("obs"),por:S.uid||"",em:new Date().toISOString()};
      await salvarVerba(id,{repasse:r},v.repasse?"atualizou o repasse negociado":"registrou o repasse negociado",[`${dBR(data)}${r.valor?" · "+brl(r.valor):""}${r.fabricante?" · origem: "+r.fabricante:""}`]);}
    else if(act==="nota"){const numero=g("numero"),data=g("data"),tipo=g("tipo");if(!numero||!data)return falha("Informe o número e a data da nota.");
      const n={tipo,numero,data,valor:num(g("valor")),link:safeUrl(g("link")),por:S.uid||"",em:new Date().toISOString()};
      const det=[`${NOTAS[tipo]} nº ${numero} · ${dBR(data)}${n.valor?" · "+brl(n.valor):""}`];
      if(tipo==="bonificacao"&&v.tipo==="bonificacao"&&!permitida(v))det.push("Campanha liberada pela nota de bonificação");
      await salvarVerba(id,{notas:[...(v.notas||[]),n]},"registrou nota recebida",det);}
    else if(act==="executar"){const data=g("data");if(!data)return falha("Informe a data da campanha.");
      const patch={executadaEm:data},det=[`Campanha executada em ${dBR(data)}`];
      if(!permitida(v)&&!adiant(v)){
        if(!g("adiant"))return falha("Pela regra, esta campanha ainda não pode acontecer. Marque o adiantamento com verba interna para seguir.");
        const ap=g("aprov");if(!ap)return falha("Diga quem aprovou o adiantamento.");
        patch.adiantamento={marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};det.push(`Adiantamento com verba interna, risco assumido, aprovado por ${ap}`);}
      await salvarVerba(id,patch,"marcou a campanha como executada",det);}
    else if(act==="comprovar"){const data=g("data");if(!data)return falha("Informe a data de envio.");
      await salvarVerba(id,{comprovadaEm:data,relatorioLink:safeUrl(g("link"))},"registrou o envio do relatório de contrapartida",[`Enviado em ${dBR(data)}`]);}
    else if(act==="perder"){const mo=g("motivo"),det=g("det");if(!mo)return falha("Escolha o motivo.");if(mo==="outro"&&!det)return falha("Descreva o motivo.");
      await salvarVerba(id,{etapa:"perdida",etapaAntes:v.etapa,motivoPerda:mo,motivoDetalhe:det,perdidaEm:hoje()},"marcou a verba como perdida",[`Motivo: ${MOTIVOS[mo]}${det?" · "+det:""}`]);}
    else if(act==="corrigir"){const e=g("etapa"),lim=g("limparExec");const patch={etapa:e};const det=[`Etapa: ${COLN[v.etapa]} → ${COLN[e]}`];
      if(v.etapa==="perdida"){patch.motivoPerda=null;patch.motivoDetalhe=null;patch.perdidaEm=null;det.push("Verba reaberta");}
      if(lim){patch.executadaEm=null;patch.comprovadaEm=null;patch.relatorioLink=null;det.push("Execução e relatório desfeitos");}
      await salvarVerba(id,patch,"corrigiu a etapa",det);}
    else if(act==="excluir"){if(!g("certeza"))return falha("Marque a caixa para confirmar a exclusão.");
      await S.db.doc("verbas/"+id).delete();await addHist("","excluiu uma verba",[`${fornNome(v.fornecedorId)} · ${brl(v.valorPrometido)}`],fornNome(v.fornecedorId));
      toast("Verba excluída");fecharModal();return;}
    toast("Salvo");S.dirty=false;if(S.modal)S.modal.keep=true;renderModal();
  }catch(e){toast(errMsg(e),true)}
}

  let b=`<div class="kpis">
    ${kpi("verbas","Verba disponível",m.disp,m.vs.length+(m.vs.length===1?" verba ligada":" verbas ligadas"))}
    ${kpi("promessa","Custo das ações",m.custo,m.total+(m.total===1?" ação":" ações"))}

    ${ed&&livres.length?`<div class="row"><select id="linkVerbaSel" aria-label="Ligar verba"><option value="">Ligar uma verba…</option>${livres.map(v=>`<option value="${v.id}">${esc(verbaNome(v))}</option>`).join("")}</select><button class="btn sm" data-act="linkVerba">Ligar</button></div>`:""}
  </section>`;
  for(const mes of [1,2]){
    const l=(c.acoes||[]).filter(a=>a.mes===mes).sort((a,b)=>String(a.data||"9").localeCompare(String(b.data||"9")));
    const tt=mes===1?"Mês 1 · Lançamento":"Mês 2 · Aceleração e fechamento";
    const dica=mes===1?"Tráfego, painéis, blitz, material no PDV, pontos em dobro no Pontuei":"Sorteio, oferta relâmpago, evento ou treinamento técnico, premiação";
    const novaAqui=S.acaoEdit&&!S.acaoEdit.aid&&S.acaoEdit.mes===mes;
    b+=`<section class="sec"><div class="sec-h"><h3>${tt}</h3><span class="muted small">${dica}</span></div>${camadasHtml(c.acoes,mes)}
      <div class="acts">${l.map(a=>S.acaoEdit&&S.acaoEdit.aid===a.id?acaoForm(c,a,mes):acaoRow(c,a,ed)).join("")}
      ${novaAqui?acaoForm(c,null,mes):""}
      ${!l.length&&!novaAqui?`<div class="empty small">Nenhuma ação no mês ${mes}.</div>`:""}</div>
      ${ed&&!novaAqui?`<div><button class="btn sm" data-act="addAcao" data-mes="${mes}">+ Ação no mês ${mes}</button></div>`:""}</section>`;
  }
  const r=c.resultados||{}, varp=+r.media3m>0?((+r.vendasCiclo/ +r.media3m)-1)*100:null;
  b+=`<section class="sec"><div class="sec-h"><h3>Resultados para o relatório de contrapartida</h3></div>
    <dl class="dl">${dd("Vendas da linha no ciclo",r.vendasCiclo?brl(r.vendasCiclo):"—")}${dd("Média dos 3 meses anteriores",r.media3m?brl(r.media3m):"—")}${dd("Variação",varp==null?"—":(varp>=0?"+":"")+varp.toFixed(1).replace(".",",")+"%")}${dd("Ações feitas",m.feitas+" de "+m.total)}</dl>
    ${(c.fotos||[]).length?`<ul class="links">${c.fotos.map(l=>`<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.titulo||l.url)}</a></li>`).join("")}</ul>`:""}
    ${r.obs?`<p class="small" style="margin:0">${esc(r.obs)}</p>`:""}
    ${ed?`<details class="more"><summary>Lançar resultados, fotos e observações</summary><div><form id="fResult" data-id="${c.id}" class="fg" novalidate>

      <div class="wide"><button class="btn pri">Salvar resultados</button></div></form></div></details>`:""}

  if(ed) b+=`<details class="more"><summary>Excluir campanha</summary><div><form class="row"><label class="check"><input type="checkbox" name="certeza"> Quero excluir esta campanha e suas ações</label><button class="btn danger" data-act="delCamp" data-id="${c.id}" type="button">Excluir campanha</button></form></div></details>`;
  b+=`<section class="sec"><h3>Histórico</h3><div id="histV">${histList(S.histV,false)}</div></section>`;
  return [head,b]}
function acaoRow(c,a,ed){
  const v=a.verbaId?verba(a.verbaId):null;
  const bloq=a.status!=="feita"&&a.pagoPor==="verba"&&v&&!permitida(v)&&!adiant(v);
  return `<div class="act ${a.status==="feita"?"feita":""}">
    <div class="t"><span class="pill ${a.status==="feita"?"ok":"info"}">${a.status==="feita"?"Feita":"Planejada"}</span> ${esc(a.tipo)}${a.descricao?` · <span style="font-weight:500">${esc(a.descricao)}</span>`:""}</div>
    <div class="b">${ed?`<button class="btn sm ${a.status==="feita"?"":"pri"}" data-act="toggleAcao" data-id="${a.id}">${a.status==="feita"?"Desfazer":"Marcar feita"}</button><button class="btn ghost sm" data-act="editAcao" data-id="${a.id}">Editar</button>`:""}</div>
    <div class="m"><span>${esc(CAMADAS[a.camada]||"")}</span><span>${dBR(a.data)}</span><span><b>${brl(a.custo)}</b> · ${esc(PAGO[a.pagoPor]||"")}${v?" ("+esc(fornNome(v.fornecedorId))+")":""}</span>${a.alcance?`<span>Alcance: ${esc(a.alcance)}</span>`:""}${a.link?`<a href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener">foto/material</a>`:""}${bloq?`<span class="pill crit">Verba ainda não liberada pela regra</span>`:""}</div>
  </div>`}
function acaoForm(c,a,mes){
  a=a||{mes,camada:"",tipo:"",pagoPor:(c.verbaIds||[]).length?"verba":"interno",verbaId:(c.verbaIds||[])[0]||"",status:"planejada",data:mes===1?c.inicio:(c.fim||c.inicio)};
  const vs=(c.verbaIds||[]).map(verba).filter(Boolean);
  return `<form class="step" id="fAcao" data-camp="${c.id}" data-aid="${a.id||""}" novalidate><h3>${a.id?"Editar ação":"Nova ação"}</h3>
    <div class="fg">
      <label class="f"><span>Mês do ciclo</span><select name="mes"><option value="1" ${+a.mes===1?"selected":""}>Mês 1 · Lançamento</option><option value="2" ${+a.mes===2?"selected":""}>Mês 2 · Aceleração</option></select></label>
      <label class="f"><span>Camada *</span><select name="camada" required><option value="">Escolha…</option>${Object.entries(CAMADAS).map(([k,n])=>`<option value="${k}" ${a.camada===k?"selected":""}>${n} (${CAMADA_DESC[k]})</option>`).join("")}</select></label>
      <label class="f"><span>Tipo de ação *</span><select name="tipo" required><option value="">Escolha…</option>${TIPOS_ACAO.map(t=>`<option ${a.tipo===t?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f wide"><span>Descrição</span><input type="text" name="descricao" value="${esc(a.descricao||"")}" placeholder="Ex.: 2 painéis na fachada, blitz com 3 promotores"></label>
      <label class="f"><span>Data</span><input type="date" name="data" value="${esc(a.data||"")}"></label>
      <label class="f"><span>Custo (R$)</span><input type="text" inputmode="decimal" name="custo" value="${inMoney(a.custo)}"></label>
      <label class="f"><span>Quem paga</span><select name="pagoPor">${Object.entries(PAGO).map(([k,n])=>`<option value="${k}" ${a.pagoPor===k?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f" id="verbaSelBox"><span>Verba usada</span><select name="verbaId"><option value="">${vs.length?"Escolha…":"Ligue uma verba à campanha primeiro"}</option>${vs.map(v=>`<option value="${v.id}" ${a.verbaId===v.id?"selected":""}>${esc(verbaNome(v))}</option>`).join("")}</select></label>
      <label class="f"><span>Situação</span><select name="status"><option value="planejada" ${a.status!=="feita"?"selected":""}>Planejada</option><option value="feita" ${a.status==="feita"?"selected":""}>Feita</option></select></label>
      <label class="f"><span>Alcance</span><input type="text" name="alcance" value="${esc(a.alcance||"")}" placeholder="Ex.: 12 mil impressões, 80 eletricistas"></label>
      <label class="f wide"><span>Link da foto ou material</span><input type="url" name="link" value="${esc(a.link||"")}" placeholder="https://"></label>
    </div>
    <div id="acaoRegra"></div>
    <div class="err" id="aErr" role="alert">${esc(S.acaoEdit&&S.acaoEdit.msg||"")}</div>
    <div class="row">${a.id?`<button type="button" class="btn danger sm" data-act="delAcao" data-id="${a.id}">Excluir ação</button>`:""}<span class="spacer"></span><button type="button" class="btn" data-act="cancelAcao">Cancelar</button><button class="btn pri">Salvar ação</button></div>

function atualizaAcao(f){
  $("#verbaSelBox").style.display=f.pagoPor.value==="verba"?"":"none";
  const v=f.pagoPor.value==="verba"&&f.verbaId.value?verba(f.verbaId.value):null;
  const box=$("#acaoRegra");
  if(v&&!permitida(v)&&!adiant(v)){
    if(box.dataset.v!==v.id){box.dataset.v=v.id;box.innerHTML=`<div class="rule warn"><b>Esta verba ainda não permite a campanha</b><span class="small">${esc(REGRA[v.tipo])}. Pode planejar; para marcar como feita, é preciso assumir o adiantamento.</span>
      <label class="check"><input type="checkbox" name="adiant"> Adiantamento com verba interna — risco assumido</label>
      <label class="f"><span>Quem aprovou</span><input type="text" name="aprov" placeholder="Nome de quem aprovou"></label></div>`;}
  } else {box.dataset.v="";box.innerHTML="";}
}
async function salvarAcao(f){
  const c=camp(f.dataset.camp);if(!c)return;
  const err=$("#aErr");err.textContent="";
  const aid=f.dataset.aid, old=(c.acoes||[]).find(x=>x.id===aid);
  const a={id:aid||rid(),mes:+f.mes.value,camada:f.camada.value,tipo:f.tipo.value,descricao:f.descricao.value.trim(),data:f.data.value,custo:num(f.custo.value),
    pagoPor:f.pagoPor.value,verbaId:f.pagoPor.value==="verba"?f.verbaId.value:"",status:f.status.value,alcance:f.alcance.value.trim(),link:safeUrl(f.link.value)};
  if(!a.camada) return err.textContent="Escolha a camada (vendedor, balcão ou eletricista).";
  if(!a.tipo) return err.textContent="Escolha o tipo de ação.";
  if(a.pagoPor==="verba"&&!a.verbaId) return err.textContent="Escolha qual verba paga esta ação.";
  const v=a.verbaId?verba(a.verbaId):null;
  let adPatch=null;
  if(a.status==="feita"&&v&&!permitida(v)&&!adiant(v)){
    const ck=f.querySelector("[name=adiant]");
    if(!ck||!ck.checked) return err.textContent="Pela regra, esta verba ainda não pode pagar a campanha. Marque o adiantamento com verba interna para marcar como feita.";
    const ap=f.aprov.value.trim(); if(!ap) return err.textContent="Diga quem aprovou o adiantamento.";
    adPatch={marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};
  }
  await gravarAcao(c,a,old,v,adPatch);
}
async function gravarAcao(c,a,old,v,adPatch){
  const acoes=(c.acoes||[]).some(x=>x.id===a.id)?(c.acoes||[]).map(x=>x.id===a.id?a:x):[...(c.acoes||[]),a];
  const det=[`${a.tipo} · ${CAMADAS[a.camada]} · mês ${a.mes} · ${brl(a.custo)} · ${PAGO[a.pagoPor]}${v?" ("+fornNome(v.fornecedorId)+")":""} · ${a.status==="feita"?"feita":"planejada"}`];
  try{
    const patch={acoes};
    if((c.status||"planejada")==="planejada"&&a.status==="feita") patch.status="andamento";
    const virouFeita=a.status==="feita"&&(!old||old.status!=="feita");
    await salvarCamp(c.id,patch,old?(virouFeita?"marcou ação como feita":"editou uma ação"):"adicionou uma ação",det);
    if(v&&adPatch) await salvarVerba(v.id,{adiantamento:adPatch},"assumiu adiantamento com verba interna",[`Aprovado por ${adPatch.aprovadoPor}`,`Na campanha ${c.nome}`]);
    if(v&&virouFeita&&a.pagoPor==="verba"){
      if(!v.executadaEm) await salvarVerba(v.id,{executadaEm:a.data||hoje()},"usou a verba e marcou a campanha como executada",[`${brl(a.custo)} · ${a.tipo} · campanha ${c.nome}`]);
      else await addHist(v.id,"usou a verba",[`${brl(a.custo)} · ${a.tipo} · campanha ${c.nome}`]);
    }
    S.acaoEdit=null;S.dirty=false;toast("Ação salva");S.modal.keep=true;renderModal();
  }catch(e){const er=$("#aErr");if(er)er.textContent=errMsg(e);else toast(errMsg(e),true);}
}
