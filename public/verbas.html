function histList(l,comAlvo){
  if(!l.length) return `<div class="empty small">Nenhuma alteração registrada ainda.</div>`;
  return `<ul class="hist">${l.map(x=>{
    let alvo="";
    if(comAlvo&&x.verbaId){const v=verba(x.verbaId);alvo=` · <a href="#" data-act="abrir" data-id="${esc(x.verbaId)}">${esc(v?fornNome(v.fornecedorId):"verba")}</a>`;}
    else if(comAlvo&&x.eventoId){const e=S.eventos.find(y=>y.id===x.eventoId);alvo=` · <a href="#" data-act="abrirEvt" data-id="${esc(x.eventoId)}">${esc(e?e.titulo:"evento")}</a>`;}
    else if(comAlvo&&x.campanhaId){const c=camp(x.campanhaId);alvo=` · <a href="#" data-act="abrirCamp" data-id="${esc(x.campanhaId)}">${esc(c?c.nome:"campanha")}</a>`;}
    return `<li><img alt="" src="${esc(avatar(x.por))}"><div><b>${esc(nome(x.por))}</b> ${esc(x.acao)}${alvo}${x.alvo?` · ${esc(x.alvo)}`:""}</div><div class="q">${dhBR(x.em)}</div>${(x.detalhes||[]).length?`<ul>${x.detalhes.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:"<span></span>"}</li>`}).join("")}</ul>`}

/* ===================== gaveta ===================== */
function abrirModal(m){S.modal=m;S.dirty=false;S.acaoEdit=null;
  if(S.histUnsub){S.histUnsub();S.histUnsub=null;S.histV=[];}
  const campo=m.tipo==="verba"?"verbaId":m.tipo==="camp"?"campanhaId":m.tipo==="evento"?"eventoId":null;
  if(campo&&S.db){S.histUnsub=S.db.collection("historico").where(campo,"==",m.id).onSnapshot(s=>{S.histV=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.em.localeCompare(a.em));const el=$("#histV");if(el)el.innerHTML=histList(S.histV,false);ensureProfiles(S.histV.map(h=>h.por));},()=>{});}
  renderModal()}
function fecharModal(){S.modal=null;S.dirty=false;S.acaoEdit=null;if(S.histUnsub){S.histUnsub();S.histUnsub=null;}S.histV=[];$("#modal").innerHTML="";document.body.style.overflow=""}
function renderModal(){
  const m=S.modal;if(!m){$("#modal").innerHTML="";return}
  let head="",body="",wide=false;
  if(m.tipo==="verba"){const v=verba(m.id);if(!v){head=`<div class="t"><h2>Verba não encontrada</h2></div>`;body=`<div class="empty">Esta verba foi excluída.</div>`;}else [head,body]=verbaView(v);}
  else if(m.tipo==="verbaForm") [head,body]=verbaForm(m.id?verba(m.id):null);
  else if(m.tipo==="camp"){wide=true;const c=camp(m.id);if(!c){head=`<div class="t"><h2>Campanha não encontrada</h2></div>`;body=`<div class="empty">Esta campanha foi excluída.</div>`;}else [head,body]=campView(c);}
  else if(m.tipo==="campForm"){wide=true;[head,body]=campForm(m.id?camp(m.id):null,m.ciclo);}
  else if(m.tipo==="forn") [head,body]=fornForm(m.id?forn(m.id):null);
  else if(m.tipo==="ciclo") [head,body]=cicloForm(ciclo(m.id));
  else if(m.tipo==="evento"){const e=S.eventos.find(x=>x.id===m.id);if(!e){head=`<div class="t"><h2>Evento não encontrado</h2></div>`;body=`<div class="empty">Este evento foi excluído.</div>`;}else [head,body]=eventoView(e);}
  else if(m.tipo==="eventoForm") [head,body]=eventoForm(m.id?S.eventos.find(x=>x.id===m.id):null, m.data);
  else if(m.tipo==="relatorio"){wide=true;const v=verba(m.id);if(!v){head=`<div class="t"><h2>Verba não encontrada</h2></div>`;body=`<div class="empty">Esta verba foi excluída.</div>`;}else [head,body]=relatorioView(v);}
  const keepScroll=$(".drawer")?$(".drawer").scrollTop:0;
  $("#modal").innerHTML=`<div class="overlay" data-act="fecharFora"><div class="drawer${wide?" wide":""}" role="dialog" aria-modal="true"><div class="dr-h">${head}<button class="btn ghost" data-act="fechar" aria-label="Fechar">✕</button></div><div class="dr-b">${body}</div></div></div>`;
  document.body.style.overflow="hidden";
  if(m.keep) $(".drawer").scrollTop=keepScroll; m.keep=false;
  const fa=$("#fAcao");if(fa)atualizaAcao(fa);
}
function dd(l,v){return `<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`}

/* ---------- ficha da verba ---------- */
function verbaView(v){
  const f=forn(v.fornecedorId)||{}, col=coluna(v), st=statusCampanha(v);
  const idx=COLS.findIndex(c=>c.k===col);
  const head=`<div class="t"><div class="muted small">${esc(TIPOS[v.tipo]||"")}${v.cicloId?" · "+esc(cicloNome(v.cicloId)):""}</div><h2>${esc(f.nome||"Fornecedor removido")}${v.titulo?` <span class="muted" style="font-weight:600">· ${esc(v.titulo)}</span>`:""}</h2></div>${v.executadaEm?`<button class="btn sm" data-act="abrirRel" data-id="${v.id}">${ico("relatorios")}Relatório</button>`:""}${pode("editar")&&v.etapa!=="perdida"?`<button class="btn sm" data-act="editVerba" data-id="${v.id}">Editar</button>`:""}`;
  let b="";
  b+= v.etapa==="perdida"
    ? `<div class="rule crit"><b>Verba perdida: ${esc(MOTIVOS[v.motivoPerda]||"")}</b><span class="small">${esc(v.motivoDetalhe||"")} ${v.perdidaEm?"· em "+dBR(v.perdidaEm):""}</span></div>`
    : `<ol class="steps" aria-label="Etapas">${COLS.slice(0,7).map((c,i)=>`<li class="${i<idx?"done":i===idx?"cur":""}" title="${c.n}"><span>${c.n}</span></li>`).join("")}</ol>`;
  const rc=v.etapa==="perdida"?"":permitida(v)?"ok":adiant(v)?"warn":"crit";
  b+=`<div class="rule ${rc}"><b>${esc(REGRA[v.tipo]||"")}</b><span class="small">${esc(st.t)}${v.dataCampanha?" · campanha marcada para "+dBR(v.dataCampanha):""}${adiant(v)?` · Adiantamento com verba interna, risco assumido. Aprovado por ${esc(v.adiantamento.aprovadoPor)} (marcado por ${esc(nome(v.adiantamento.por))} em ${dBR(v.adiantamento.em)})`:""}</span></div>`;
  if(f.distribuidor) b+=`<div class="banner small">${esc(f.nome)} é distribuidor: a verba vem do repasse dos fabricantes.</div>`;
  const u=usado(v), d=disponivel(v), nn=(v.notas||[]).length;
  b+=`<div class="checks">
    <div class="ck ${v.repasse?"on":""}"><span class="d">${v.repasse?ico("check"):""}</span><div><b>Pagamento negociado</b><small>${v.repasse?(v.repasse.pedido?"Pedido "+esc(v.repasse.pedido)+" · ":"")+dBR(v.repasse.data):"Compras"}</small></div></div>
    <div class="ck ${nn?"on":""}"><span class="d">${nn?ico("check"):""}</span><div><b>Nota recebida</b><small>${nn?(nn+(nn>1?" notas":" nota")):"Financeiro"}</small></div></div>
    <div class="ck ${v.etapa==="recebida"?"on":""}"><span class="d">${v.etapa==="recebida"?ico("check"):""}</span><div><b>Valor recebido</b><small>${v.etapa==="recebida"?brl(v.valorRecebido)+" em "+dBR(v.dataEntrada):"Financeiro"}</small></div></div>
    <div class="ck ${u>0?"on":""}"><span class="d">${u>0?ico("check"):""}</span><div><b>Usado pelo Marketing</b><small>${u>0?brl(u)+" de "+brl(d):"Marketing"}</small></div></div>
  </div>`;
  b+=passosHtml(v);
  b+=`<section class="sec"><h3>Valores</h3><dl class="dl">
    ${dd("Prometido",brl(v.valorPrometido))}${dd("Parte fixa",brl(v.parteFixa))}${dd("Parte variável",brl(v.parteVariavel))}
    ${dd("Confirmado",v.valorConfirmado?brl(v.valorConfirmado):"—")}${dd("Recebido",v.etapa==="recebida"?brl(v.valorRecebido):"—")}${dd("Saldo a usar",brl(d-u))}</dl></section>`;
  if(temMeta(v)){
    const r=realizado(v), p=+v.meta>0?r/v.meta*100:0;
    b+=`<section class="sec"><h3>Meta</h3><dl class="dl">${dd("Meta",brl(v.meta))}${dd("Realizado",brl(r))}${dd("Atingimento",+v.meta>0?Math.round(p)+"%":"—")}${dd("Libera pelo realizado",brl(liberado(v)))}${dd("Apuração",v.apuracaoInicio?dBR(v.apuracaoInicio)+" a "+dBR(v.apuracaoFim):"—")}</dl>
      ${+v.meta>0?`<div class="bar ${p>=100?"ok":""}"><i style="width:${Math.min(100,p)}%"></i></div>`:""}
      ${v.regraTexto?`<p style="margin:0" class="small">${esc(v.regraTexto)}</p>`:""}
      ${(v.degraus||[]).length?`<div class="chips">${v.degraus.map(x=>`<span class="pill info">${esc(x.pct)}% da meta libera ${esc(x.libera)}% do variável</span>`).join("")}</div>`:""}
      ${(v.realizados||[]).length?`<div class="tablewrap"><table><thead><tr><th>Mês</th><th class="r">Realizado</th></tr></thead><tbody>${[...v.realizados].sort((a,b)=>a.mes.localeCompare(b.mes)).map(x=>`<tr><td>${mesBR(x.mes)}</td><td class="r">${brl(x.valor)}</td></tr>`).join("")}</tbody></table></div>`:`<span class="muted small">Nenhum realizado lançado.</span>`}
    </section>`;
  }
  const rp=v.repasse||{};
  b+=`<section class="sec"><div class="sec-h"><h3>Pagamento e notas</h3></div>
    ${v.repasse?`<ul class="mini"><li><b>Pagamento negociado${rp.pedido?" · pedido "+esc(rp.pedido):""}</b><span class="muted">${dBR(rp.data)}${rp.forma?" · "+esc(FORMAS[rp.forma]||""):""}${rp.fabricante?" · origem: "+esc(rp.fabricante):""}${rp.obs?" · "+esc(rp.obs):""} · por ${esc(nome(rp.por))}</span><span class="v">${rp.valor?brl(rp.valor):""}</span></li></ul>`:`<span class="muted small">Compras ainda não negociou o pagamento no pedido.</span>`}
    ${nn?`<ul class="mini">${v.notas.map(n=>`<li><b>${esc(NOTAS[n.tipo]||"Nota")}${n.numero?" nº "+esc(n.numero):""}</b><span class="muted">${dBR(n.data)} · por ${esc(nome(n.por))}${n.link?` · <a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener">ver nota</a>`:""}</span><span class="v">${n.valor?brl(n.valor):""}</span></li>`).join("")}</ul>`:`<span class="muted small">Nenhuma nota registrada pelo Financeiro.</span>`}
    ${v.etapa!=="perdida"&&pode("repasse")?`<details class="more"><summary>${v.repasse?"Atualizar":"Registrar"} pagamento negociado no pedido (Compras)</summary><div><form data-step class="fg">
      <label class="f"><span>Nº do pedido</span><input type="text" name="pedido" value="${esc(rp.pedido||"")}" placeholder="Pedido de compra"></label>
      <label class="f"><span>Como o fornecedor paga</span><select name="forma">${Object.entries(FORMAS).map(([k,n])=>`<option value="${k}" ${(rp.forma||v.formaRecebimento)===k?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f"><span>Valor (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(rp.valor||esperado(v))}"></label>
      <label class="f"><span>Data da negociação</span><input type="date" name="data" value="${esc(rp.data||hoje())}" required></label>
      ${f.distribuidor?`<label class="f"><span>Fabricante de origem</span><input type="text" name="fab" value="${esc(rp.fabricante||"")}" placeholder="Fabricante que repassa via ${esc(f.nome)}"></label>`:""}
      <label class="f wide"><span>Condições combinadas</span><input type="text" name="obs" value="${esc(rp.obs||"")}" placeholder="Ex.: desconto de 5% nos pedidos de março, até R$ 30 mil"></label>
      <div class="wide"><button class="btn pri" data-step-act="repasse" data-id="${v.id}">Salvar pagamento negociado</button></div></form></div></details>`:""}
    ${v.etapa!=="perdida"&&pode("nota")?`<details class="more"><summary>Registrar nota recebida (Financeiro)</summary><div><form data-step class="fg">
      <label class="f"><span>Tipo de nota</span><select name="tipo">${Object.entries(NOTAS).map(([k,n])=>`<option value="${k}" ${(v.tipo==="bonificacao"&&k==="bonificacao")?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f"><span>Número da nota</span><input type="text" name="numero" required></label>
      <label class="f"><span>Data de chegada</span><input type="date" name="data" value="${hoje()}" required></label>
      <label class="f"><span>Valor (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(esperado(v))}"></label>
      <label class="f wide"><span>Link da nota (opcional)</span><input type="url" name="link" placeholder="https://"></label>
      ${v.tipo==="bonificacao"?`<div class="wide small muted">A nota de bonificação libera a campanha desta verba.</div>`:""}
      <div class="wide"><button class="btn pri" data-step-act="nota" data-id="${v.id}">Registrar nota</button></div></form></div></details>`:""}
  </section>`;
  const us=usos(v);
  b+=`<section class="sec"><div class="sec-h"><h3>Uso pelo Marketing</h3><span class="pill ${u>d?"crit":"ok"} spacer">${brl(u)} de ${brl(d)}</span></div>
    ${d>0?`<div class="bar ${u>d?"crit":"ok"}"><i style="width:${Math.min(100,u/d*100)}%"></i></div>`:""}
    ${us.length?`<ul class="mini">${us.map(({c,a})=>`<li><a href="#" data-act="abrirCamp" data-id="${c.id}">${esc(c.nome)}</a><span class="muted">${esc(a.tipo)} · ${esc(CAMADAS[a.camada]||"")} · ${dBR(a.data)} · ${a.status==="feita"?"feita":"planejada"}</span><span class="v">${brl(a.custo)}</span></li>`).join("")}</ul>`
      :`<span class="muted small">Nenhuma ação de campanha usa esta verba ainda. O Marketing liga a verba em Campanhas.</span>`}
  </section>`;
  b+=`<section class="sec"><h3>Recebimento e campanha</h3><dl class="dl">
    ${dd("Forma de recebimento",FORMAS[v.etapa==="recebida"&&v.formaReal?v.formaReal:v.formaRecebimento]||"—")}${dd("Previsão de entrada",dBR(v.previsaoEntrada))}${dd("Data real de entrada",dBR(v.dataEntrada))}
    ${dd("Data da campanha",dBR(v.dataCampanha))}${dd("Executada em",dBR(v.executadaEm))}${dd("Relatório enviado em",dBR(v.comprovadaEm))}</dl>
    ${v.relatorioLink?`<a href="${esc(safeUrl(v.relatorioLink))}" target="_blank" rel="noopener">Abrir relatório de contrapartida</a>`:""}</section>`;
  const resp=v.responsaveis||{};
  b+=`<section class="sec"><h3>Responsáveis</h3><dl class="dl">${AREAS_FLUXO.map(a=>dd(AREAS[a],resp[a]?nome(resp[a]):"—")).join("")}</dl></section>`;
  b+=`<section class="sec"><h3>Contrapartidas prometidas ao fornecedor</h3>${(v.contrapartidas||[]).length?`<ul style="margin:0;padding-left:18px">${v.contrapartidas.map(c=>`<li>${esc(c.texto)}</li>`).join("")}</ul>`:`<span class="muted small">Nenhuma contrapartida registrada.</span>`}</section>`;
  b+=`<section class="sec"><h3>Acordo</h3>${(v.links||[]).length?`<ul class="links">${v.links.map(l=>`<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.titulo||l.url)}</a></li>`).join("")}</ul>`:`<span class="muted small">Nenhum link do acordo anexado.</span>`}</section>`;
  b+=maisAcoes(v);
  b+=`<section class="sec"><h3>Histórico</h3><div id="histV">${histList(S.histV,false)}</div><span class="muted small">Criada por ${esc(nome(v.criadoPor))} em ${dhBR(v.criadoEm)}</span></section>`;
  return [head,b]}

function passosHtml(v){
  if(v.etapa==="perdida") return "";
  let h="";const e=v.etapa;
  const box=(titulo,quem,ok,conteudo)=>`<form class="step" data-step><h3>${titulo}</h3><div class="muted who">Responsável: ${quem}</div>${ok?conteudo:`<div class="muted small">Aguardando ${quem}.</div>`}</form>`;
  if(e==="negociada"){
    const sem=!(v.links||[]).length;
    h+=box("Formalizar o acordo","Marketing",pode("formalizar"),
      sem?`<div class="small">Anexe o link do acordo por escrito (e-mail, PDF no Drive, contrato) para formalizar.</div><div><button type="button" class="btn" data-act="editVerba" data-id="${v.id}">Anexar link do acordo</button></div>`
         :`<div class="small">O acordo por escrito já está anexado.</div><div><button class="btn pri" data-step-act="formalizar" data-id="${v.id}">Marcar como formalizada</button></div>`);
  }
  if(e==="formalizada"){
    if(temMeta(v)) h+=box("Iniciar a apuração da meta","Compras",pode("apuracao"),
      `<div class="fg"><label class="f"><span>Início da apuração</span><input type="date" name="ini" value="${esc(v.apuracaoInicio||"")}" required></label><label class="f"><span>Fim da apuração</span><input type="date" name="fim" value="${esc(v.apuracaoFim||"")}"><small>Vazio = 3 meses após o início</small></label><label class="f"><span>Meta (R$)</span><input type="text" inputmode="decimal" name="meta" value="${inMoney(v.meta)}" required></label></div><div><button class="btn pri" data-step-act="apuracao" data-id="${v.id}">Iniciar apuração</button></div>`);
    else h+=confirmBox(v,"Confirmar a liberação da verba",esperado(v));
  }
  if(e==="apuracao"){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    h+=box("Lançar o realizado do mês","Compras",pode("realizado"),
      `<div class="fg"><label class="f"><span>Mês</span><input type="month" name="mes" value="${ym}" required></label><label class="f"><span>Compras no mês (R$)</span><input type="text" inputmode="decimal" name="valor" required placeholder="0"></label></div><div class="muted small">Se o mês já tiver valor, ele é substituído.</div><div><button class="btn pri" data-step-act="realizado" data-id="${v.id}">Lançar realizado</button></div>`);
    h+=confirmBox(v,"Confirmar a meta batida",liberado(v));
  }
  if(e==="confirmada"){
    h+=box(v.tipo==="bonificacao"?"Confirmar o recebimento da nota de bonificação":"Confirmar o recebimento","Financeiro",pode("receber"),
      `<div class="fg"><label class="f"><span>Data real de entrada</span><input type="date" name="data" value="${hoje()}" required></label><label class="f"><span>Valor recebido (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(esperado(v))}" required></label>
      <label class="f"><span>Forma de recebimento</span><select name="forma" required>${Object.entries(FORMAS).map(([k,n])=>`<option value="${k}" ${((v.repasse&&v.repasse.forma)||v.formaRecebimento)===k?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f"><span>Número da nota ${v.tipo==="bonificacao"?"de bonificação":"(se houver)"}</span><input type="text" name="numero"></label></div>
      <div><button class="btn pri" data-step-act="receber" data-id="${v.id}">Confirmar recebimento</button></div>`);
  }
  if(!v.executadaEm){
    const precisa=!permitida(v)&&!adiant(v);
    h+=box("Executar a campanha","Marketing",pode("executar"),
      `<div class="small muted">O caminho recomendado é registrar as ações em Campanhas: a primeira ação feita com esta verba já marca a execução. Use abaixo só se a campanha não tiver ações cadastradas.</div>
      <label class="f" style="max-width:220px"><span>Data em que a campanha aconteceu</span><input type="date" name="data" value="${hoje()}" required></label>
      ${precisa?`<div class="rule warn"><b>A regra ainda não permite esta campanha</b><span class="small">${esc(REGRA[v.tipo])}. Para fazer antes, marque o adiantamento e diga quem aprovou.</span>
        <label class="check"><input type="checkbox" name="adiant"> Adiantamento com verba interna — risco assumido</label>
        <label class="f"><span>Quem aprovou</span><input type="text" name="aprov" placeholder="Nome de quem aprovou"></label></div>`:""}
      <div><button class="btn" data-step-act="executar" data-id="${v.id}">Marcar campanha como executada</button></div>`);
  } else if(!v.comprovadaEm){
    h+=box("Enviar o relatório de contrapartida","Marketing",pode("comprovar"),
      `<div class="fg"><label class="f"><span>Data de envio ao fornecedor</span><input type="date" name="data" value="${hoje()}" required></label><label class="f"><span>Link do relatório (opcional)</span><input type="url" name="link" placeholder="https://"></label></div><div><button class="btn pri" data-step-act="comprovar" data-id="${v.id}">Marcar relatório como enviado</button></div>`);
  }
  return h}
function confirmBox(v,titulo,sug){
  return `<form class="step" data-step><h3>${titulo}</h3><div class="muted who">Responsável: Marketing</div>${pode("confirmar")?`
    <div class="fg"><label class="f"><span>Valor confirmado (R$)</span><input type="text" inputmode="decimal" name="valor" value="${inMoney(sug)}" required><small>${temMeta(v)?"Sugestão pelo realizado e degraus: "+brl(liberado(v)):"Valor prometido: "+brl(v.valorPrometido)}</small></label>
    <label class="f"><span>Previsão de entrada</span><input type="date" name="prev" value="${esc(v.previsaoEntrada||"")}" required></label></div>
    <div><button class="btn pri" data-step-act="confirmar" data-id="${v.id}">Confirmar verba</button></div>`:`<div class="muted small">Aguardando Marketing.</div>`}</form>`}
function maisAcoes(v){
  let h="";
  if(v.etapa!=="perdida"&&v.etapa!=="recebida"&&pode("perder")) h+=`<details class="more"><summary>Marcar como perdida</summary><div><form data-step class="fg">
    <label class="f"><span>Motivo</span><select name="motivo" required><option value="">Escolha…</option>${Object.entries(MOTIVOS).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></label>
    <label class="f wide"><span>Detalhe</span><textarea name="det" placeholder="O que aconteceu (obrigatório se o motivo for Outro)"></textarea></label>
    <div class="wide"><button class="btn danger" data-step-act="perder" data-id="${v.id}">Marcar como perdida</button></div></form></div></details>`;
  if(pode("corrigir")) h+=`<details class="more"><summary>Corrigir etapa ou excluir</summary><div>
    <form data-step class="row"><select name="etapa" aria-label="Etapa">${["negociada","formalizada","apuracao","confirmada","recebida"].map(k=>`<option value="${k}" ${v.etapa===k?"selected":""}>${COLN[k]}</option>`).join("")}</select>
    <label class="check"><input type="checkbox" name="limparExec"> Desfazer execução e relatório</label><button class="btn" data-step-act="corrigir" data-id="${v.id}">Aplicar correção</button></form>
    <form data-step class="row"><label class="check"><input type="checkbox" name="certeza"> Quero excluir esta verba de vez</label><button class="btn danger" data-step-act="excluir" data-id="${v.id}">Excluir verba</button></form></div></details>`;
  return h}

/* ---------- formulário da verba ---------- */
function verbaForm(v){
  const nova=!v; v=v||{tipo:"",responsaveis:{},degraus:[{pct:80,libera:50},{pct:100,libera:100}],contrapartidas:[],links:[],formaRecebimento:"deposito"};
  if(nova&&area()&&area()!=="diretoria"&&S.uid) v.responsaveis={[area()]:S.uid};
  const fsel=S.fornecedores.filter(f=>f.ativo!==false||f.id===v.fornecedorId).slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const respSel=a=>{const ms=membros(a);const cur=(v.responsaveis||{})[a]||"";
    return `<label class="f"><span>${AREAS[a]}</span><select name="resp_${a}"><option value="">${ms.length?"Escolha…":"Ninguém cadastrado"}</option>${ms.map(id=>`<option value="${id}" ${cur===id?"selected":""}>${esc(nome(id))}</option>`).join("")}</select></label>`};
  const head=`<div class="t"><h2>${nova?"Nova verba":"Editar verba"}</h2>${nova?"":`<div class="muted small">${esc(fornNome(v.fornecedorId))}</div>`}</div>`;
  const b=`<form id="fVerba" data-id="${v.id||""}" novalidate>
  <div style="display:flex;flex-direction:column;gap:16px">
  <section class="sec"><h3>Fornecedor e campanha</h3><div class="fg">
    <label class="f"><span>Fornecedor *</span><select name="fornecedorId" required><option value="">Escolha…</option>${fsel.map(f=>`<option value="${f.id}" ${v.fornecedorId===f.id?"selected":""}>${esc(f.nome)} (${esc(f.faixa||"—")})</option>`).join("")}</select></label>
    <label class="f"><span>Ciclo / campanha ligada</span><select name="cicloId"><option value="">Sem ciclo</option>${S.ciclos.map(c=>`<option value="${c.id}" ${v.cicloId===c.id?"selected":""}>${esc(cicloNome(c.id))} ${c.ano}</option>`).join("")}</select></label>

  </div></form>`;
  setTimeout(()=>{const f=$("#fVerba");if(f){f._adiant=v.adiantamento||null;atualizaForm(f);}},0);
  return [head,b]}
const degRow=d=>`<div class="rowi"><input class="n" type="text" inputmode="decimal" data-k="pct" value="${esc(d.pct??"")}" aria-label="% da meta"><span class="muted small">% da meta libera</span><input class="n" type="text" inputmode="decimal" data-k="libera" value="${esc(d.libera??"")}" aria-label="% liberado"><span class="muted small">%</span><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
const cpRow=c=>`<div class="rowi"><input type="text" data-k="texto" value="${esc(c.texto||"")}" placeholder="Ex.: 2 painéis na loja por 60 dias"><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
const lkRow=l=>`<div class="rowi"><input type="text" data-k="titulo" value="${esc(l.titulo||"")}" placeholder="Descrição" style="flex:0 1 35%"><input type="url" data-k="url" value="${esc(l.url||"")}" placeholder="https://"><button type="button" class="btn ghost sm" data-act="delRow" aria-label="Remover">✕</button></div>`;
function atualizaForm(f){
  const tipo=(f.querySelector("[name=tipo]:checked")||{}).value;
  const fx=num(f.parteFixa.value), vr=num(f.parteVariavel.value), pr=num(f.valorPrometido.value);
  $("#somaPartes").textContent=(fx||vr)?(Math.abs(fx+vr-pr)>0.5?`Atenção: fixa + variável = ${brl(fx+vr)}, diferente do prometido (${brl(pr)}).`:`Fixa + variável = ${brl(fx+vr)}.`):"";
  $("#secMeta").style.display=(tipo==="condicionada"||num(f.meta.value)>0||!tipo)?"":"none";
  const box=$("#adiantBox");const a=f._adiant;
  if(tipo==="condicionada"||tipo==="bonificacao"){
    if(!box.dataset.on){box.dataset.on="1";box.innerHTML=`<div class="rule warn" style="margin-top:10px"><b>Campanha antes da verba?</b><span class="small" id="adTxt"></span>
      <label class="check"><input type="checkbox" name="adiant" ${a&&a.marcado?"checked":""}> Adiantamento com verba interna — risco assumido</label>
      <label class="f"><span>Quem aprovou</span><input type="text" name="aprov" value="${esc(a&&a.aprovadoPor||"")}" placeholder="Nome de quem aprovou"></label></div>`;}
    $("#adTxt").textContent="Regra deste tipo: "+REGRA[tipo].toLowerCase()+". Se a campanha vai acontecer antes, marque abaixo e diga quem aprovou.";
  } else {box.dataset.on="";box.innerHTML="";}
}
function lerRows(id,map){return $$("#"+id+" .rowi").map(r=>{const o={};$$("input",r).forEach(i=>o[i.dataset.k]=i.value.trim());return map(o)}).filter(Boolean)}
const CAMPOS={fornecedorId:["Fornecedor","forn"],cicloId:["Ciclo","ciclo"],titulo:["Campanha","txt"],tipo:["Tipo de verba","tipo"],valorPrometido:["Valor prometido","brl"],parteFixa:["Parte fixa","brl"],parteVariavel:["Parte variável","brl"],meta:["Meta","brl"],apuracaoInicio:["Início da apuração","data"],apuracaoFim:["Fim da apuração","data"],regraTexto:["Regra da meta","txt"],degraus:["Degraus","deg"],formaRecebimento:["Forma de recebimento","forma"],previsaoEntrada:["Previsão de entrada","data"],dataCampanha:["Data da campanha","data"],adiantamento:["Adiantamento","adiant"],responsaveis:["Responsáveis","resp"],contrapartidas:["Contrapartidas","cp"],links:["Links do acordo","lk"]};
function fmtCampo(t,x){switch(t){case"brl":return brl(x);case"data":return dBR(x);case"forn":return fornNome(x);case"ciclo":return x?cicloNome(x):"Sem ciclo";case"tipo":return TIPOS[x]||"—";case"forma":return FORMAS[x]||"—";
  case"deg":return (x||[]).map(d=>d.pct+"% → "+d.libera+"%").join("; ")||"—";case"cp":return (x||[]).map(c=>c.texto).join("; ")||"—";case"lk":return (x||[]).length+" link(s)";
  case"adiant":return x&&x.marcado?"marcado, aprovado por "+x.aprovadoPor:"não";default:return x||"—"}}
function isEmpty(x){return x==null||x===""||x===0||(Array.isArray(x)&&!x.length)}
async function salvarVerbaForm(f){
  const err=$("#fErr");err.textContent="";
  const id=f.dataset.id, old=id?verba(id):null;
  const tipo=(f.querySelector("[name=tipo]:checked")||{}).value||"";
  const d={
    fornecedorId:f.fornecedorId.value, cicloId:f.cicloId.value, titulo:f.titulo.value.trim(), tipo,
    valorPrometido:num(f.valorPrometido.value), parteFixa:num(f.parteFixa.value), parteVariavel:num(f.parteVariavel.value),
    meta:num(f.meta.value), apuracaoInicio:f.apuracaoInicio.value, apuracaoFim:f.apuracaoFim.value, regraTexto:f.regraTexto.value.trim(),
    degraus:lerRows("rowsDeg",o=>(num(o.pct)>0?{pct:num(o.pct),libera:num(o.libera)}:null)),
    formaRecebimento:f.formaRecebimento.value, previsaoEntrada:f.previsaoEntrada.value, dataCampanha:f.dataCampanha.value,
    responsaveis:Object.fromEntries(AREAS_FLUXO.map(a=>[a,f["resp_"+a].value])),
    contrapartidas:lerRows("rowsCp",o=>o.texto?{texto:o.texto,entregue:!!((old&&old.contrapartidas||[]).find(c=>c.texto===o.texto)||{}).entregue}:null),
    links:lerRows("rowsLk",o=>o.url?{titulo:o.titulo,url:safeUrl(o.url)}:null)
  };
  if(!d.fornecedorId) return err.textContent="Escolha o fornecedor.";
  if(!d.tipo) return err.textContent="Escolha o tipo de verba.";
  if(!(d.valorPrometido>0)) return err.textContent="Informe o valor prometido.";
  if(d.apuracaoInicio&&!d.apuracaoFim) d.apuracaoFim=fimTrimestre(d.apuracaoInicio);
  if(d.apuracaoInicio&&d.apuracaoFim<d.apuracaoInicio) return err.textContent="O fim da apuração está antes do início.";
  if(!d.dataCampanha&&d.cicloId){const c=ciclo(d.cicloId);if(c)d.dataCampanha=c.inicio;}
  const ad=f.querySelector("[name=adiant]");
  if(ad){
    if(ad.checked){const ap=f.aprov.value.trim();if(!ap)return err.textContent="Diga quem aprovou o adiantamento com verba interna.";
      const prev=old&&old.adiantamento;d.adiantamento=(prev&&prev.marcado&&prev.aprovadoPor===ap)?prev:{marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};}
    else d.adiantamento=null;
  } else d.adiantamento=old?old.adiantamento||null:null;
  const btn=f.querySelector("[type=submit]");btn.disabled=true;
  try{
    const now=new Date().toISOString();
    if(!old){
      const ref=S.db.collection("verbas").doc();
      await ref.set({...d,etapa:"negociada",realizados:[],notas:[],criadoEm:now,criadoPor:S.uid||"",atualizadoEm:now,atualizadoPor:S.uid||""});
      await addHist(ref.id,"cadastrou a verba (Negociada)",[`${fornNome(d.fornecedorId)} · ${TIPOS[d.tipo]} · ${brl(d.valorPrometido)}`]);
      toast("Verba cadastrada");S.dirty=false;abrirModal({tipo:"verba",id:ref.id});
    } else {
      const patch={},det=[];
      for(const k of Object.keys(d)){const a=JSON.stringify(old[k]??null),b=JSON.stringify(d[k]??null);
        if(a!==b && !(isEmpty(old[k])&&isEmpty(d[k]))){patch[k]=d[k];const [lb,t]=CAMPOS[k]||[k,"txt"];det.push(t==="resp"?"Responsáveis alterados":`${lb}: ${fmtCampo(t,old[k])} → ${fmtCampo(t,d[k])}`);}}
      if(!det.length){toast("Nada foi alterado");S.dirty=false;abrirModal({tipo:"verba",id});return;}
      await salvarVerba(id,patch,"editou a verba",det);
      toast("Alterações salvas");S.dirty=false;abrirModal({tipo:"verba",id});
    }
  }catch(e){btn.disabled=false;err.textContent=errMsg(e);}
}

/* ---------- passos da verba ---------- */
async function passo(act,id,form){
  const v=verba(id);if(!v)return;
  const g=n=>{const el=form.querySelector(`[name=${n}]`);return el?(el.type==="checkbox"?el.checked:el.value.trim()):""};
  const falha=m=>{toast(m,true)};
  try{
    if(act==="formalizar"){if(!(v.links||[]).length)return falha("Anexe o link do acordo antes de formalizar.");
      await salvarVerba(id,{etapa:"formalizada",formalizadaEm:hoje()},"formalizou a verba",["Etapa: Negociada → Formalizada"]);}
    else if(act==="apuracao"){const ini=g("ini");let fim=g("fim");const meta=num(g("meta"));
      if(!ini||!(meta>0))return falha("Informe o início da apuração e a meta.");
      if(!fim)fim=fimTrimestre(ini);if(fim<ini)return falha("O fim da apuração está antes do início.");
      await salvarVerba(id,{etapa:"apuracao",apuracaoInicio:ini,apuracaoFim:fim,meta},"iniciou a apuração",[`Etapa: Formalizada → Em apuração`,`Meta ${brl(meta)} de ${dBR(ini)} a ${dBR(fim)}`]);}
    else if(act==="realizado"){const mes=g("mes"),val=num(g("valor"));if(!mes)return falha("Escolha o mês.");
      const l=(v.realizados||[]).filter(r=>r.mes!==mes);const ant=(v.realizados||[]).find(r=>r.mes===mes);l.push({mes,valor:val});
      await salvarVerba(id,{realizados:l},"lançou realizado",[`${mesBR(mes)}: ${ant?brl(ant.valor)+" → ":""}${brl(val)}`]);}
    else if(act==="confirmar"){const val=num(g("valor")),prev=g("prev");if(!(val>0))return falha("Informe o valor confirmado.");if(!prev)return falha("Informe a previsão de entrada.");
      await salvarVerba(id,{etapa:"confirmada",valorConfirmado:val,previsaoEntrada:prev,confirmadaEm:hoje()},"confirmou a verba",[`Etapa: ${COLN[v.etapa]} → Confirmada`,`Valor confirmado ${brl(val)}, previsão ${dBR(prev)}`]);}
    else if(act==="receber"){const data=g("data"),val=num(g("valor")),forma=g("forma"),numero=g("numero");if(!data||!(val>0))return falha("Informe a data e o valor recebido.");
      if(v.tipo==="bonificacao"&&!numero&&!notaBonif(v))return falha("Informe o número da nota de bonificação.");
      const patch={etapa:"recebida",dataEntrada:data,valorRecebido:val,formaReal:forma};const det=[`Etapa: Confirmada → Recebida`,`${brl(val)} em ${dBR(data)} por ${FORMAS[forma]}`];
      if(numero){patch.notas=[...(v.notas||[]),{tipo:v.tipo==="bonificacao"?"bonificacao":forma==="boleto"?"credito":"outra",numero,data,valor:val,link:"",por:S.uid||"",em:new Date().toISOString()}];det.push("Nota nº "+numero);}
      await salvarVerba(id,patch,"registrou a entrada",det);}
    else if(act==="repasse"){const data=g("data");if(!data)return falha("Informe a data da negociação.");
      const r={data,pedido:g("pedido"),forma:g("forma"),valor:num(g("valor")),fabricante:g("fab"),obs:g("obs"),por:S.uid||"",em:new Date().toISOString()};
      await salvarVerba(id,{repasse:r},v.repasse?"atualizou o pagamento negociado no pedido":"negociou o pagamento no pedido",[`${r.pedido?"Pedido "+r.pedido+" · ":""}${FORMAS[r.forma]||""}${r.valor?" · "+brl(r.valor):""} · ${dBR(data)}${r.fabricante?" · origem: "+r.fabricante:""}`]);}
    else if(act==="nota"){const numero=g("numero"),data=g("data"),tipo=g("tipo");if(!numero||!data)return falha("Informe o número e a data da nota.");
      const n={tipo,numero,data,valor:num(g("valor")),link:safeUrl(g("link")),por:S.uid||"",em:new Date().toISOString()};
      const det=[`${NOTAS[tipo]} nº ${numero} · ${dBR(data)}${n.valor?" · "+brl(n.valor):""}`];
      if(tipo==="bonificacao"&&v.tipo==="bonificacao"&&!permitida(v))det.push("Campanha liberada pela nota de bonificação");
      await salvarVerba(id,{notas:[...(v.notas||[]),n]},"registrou nota recebida",det);}
    else if(act==="executar"){const data=g("data");if(!data)return falha("Informe a data da campanha.");
      const patch={executadaEm:data},det=[`Campanha executada em ${dBR(data)}`];
      if(!permitida(v)&&!adiant(v)){
        if(!g("adiant"))return falha("Pela regra, esta campanha ainda não pode acontecer. Marque o adiantamento com verba interna para seguir.");
        const ap=g("aprov");if(!ap)return falha("Diga quem aprovou o adiantamento.");
        patch.adiantamento={marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};det.push(`Adiantamento com verba interna, risco assumido, aprovado por ${ap}`);}
      await salvarVerba(id,patch,"marcou a campanha como executada",det);}
    else if(act==="comprovar"){const data=g("data");if(!data)return falha("Informe a data de envio.");
      await salvarVerba(id,{comprovadaEm:data,relatorioLink:safeUrl(g("link"))},"registrou o envio do relatório de contrapartida",[`Enviado em ${dBR(data)}`]);}
    else if(act==="perder"){const mo=g("motivo"),det=g("det");if(!mo)return falha("Escolha o motivo.");if(mo==="outro"&&!det)return falha("Descreva o motivo.");
      await salvarVerba(id,{etapa:"perdida",etapaAntes:v.etapa,motivoPerda:mo,motivoDetalhe:det,perdidaEm:hoje()},"marcou a verba como perdida",[`Motivo: ${MOTIVOS[mo]}${det?" · "+det:""}`]);}
    else if(act==="corrigir"){const e=g("etapa"),lim=g("limparExec");const patch={etapa:e};const det=[`Etapa: ${COLN[v.etapa]} → ${COLN[e]}`];
      if(v.etapa==="perdida"){patch.motivoPerda=null;patch.motivoDetalhe=null;patch.perdidaEm=null;det.push("Verba reaberta");}
      if(lim){patch.executadaEm=null;patch.comprovadaEm=null;patch.relatorioLink=null;det.push("Execução e relatório desfeitos");}
      await salvarVerba(id,patch,"corrigiu a etapa",det);}
    else if(act==="excluir"){if(!g("certeza"))return falha("Marque a caixa para confirmar a exclusão.");
      await S.db.doc("verbas/"+id).delete();await addHist("","excluiu uma verba",[`${fornNome(v.fornecedorId)} · ${brl(v.valorPrometido)}`],fornNome(v.fornecedorId));
      toast("Verba excluída");fecharModal();return;}
    toast("Salvo");S.dirty=false;if(S.modal)S.modal.keep=true;renderModal();
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- campanha: ficha ---------- */

async function salvarAcao(f){
  const c=camp(f.dataset.camp);if(!c)return;
  const err=$("#aErr");err.textContent="";
  const aid=f.dataset.aid, old=(c.acoes||[]).find(x=>x.id===aid);
  const a={id:aid||rid(),mes:+f.mes.value,camada:f.camada.value,tipo:f.tipo.value,descricao:f.descricao.value.trim(),data:f.data.value,custo:num(f.custo.value),
    pagoPor:f.pagoPor.value,verbaId:f.pagoPor.value==="verba"?f.verbaId.value:"",status:f.status.value,alcance:f.alcance.value.trim(),link:safeUrl(f.link.value)};
  if(!a.camada) return err.textContent="Escolha a camada (vendedor, balcão ou eletricista).";
  if(!a.tipo) return err.textContent="Escolha o tipo de ação.";
  if(a.pagoPor==="verba"&&!a.verbaId) return err.textContent="Escolha qual verba paga esta ação.";
  const v=a.verbaId?verba(a.verbaId):null;
  let adPatch=null;
  if(a.status==="feita"&&v&&!permitida(v)&&!adiant(v)){
    const ck=f.querySelector("[name=adiant]");
    if(!ck||!ck.checked) return err.textContent="Pela regra, esta verba ainda não pode pagar a campanha. Marque o adiantamento com verba interna para marcar como feita.";
    const ap=f.aprov.value.trim(); if(!ap) return err.textContent="Diga quem aprovou o adiantamento.";
    adPatch={marcado:true,aprovadoPor:ap,por:S.uid||"",em:hoje()};
  }
  await gravarAcao(c,a,old,v,adPatch);
}
async function gravarAcao(c,a,old,v,adPatch){
  const acoes=(c.acoes||[]).some(x=>x.id===a.id)?(c.acoes||[]).map(x=>x.id===a.id?a:x):[...(c.acoes||[]),a];
  const det=[`${a.tipo} · ${CAMADAS[a.camada]} · mês ${a.mes} · ${brl(a.custo)} · ${PAGO[a.pagoPor]}${v?" ("+fornNome(v.fornecedorId)+")":""} · ${a.status==="feita"?"feita":"planejada"}`];
  try{
    const patch={acoes};
    if((c.status||"planejada")==="planejada"&&a.status==="feita") patch.status="andamento";
    const virouFeita=a.status==="feita"&&(!old||old.status!=="feita");
    await salvarCamp(c.id,patch,old?(virouFeita?"marcou ação como feita":"editou uma ação"):"adicionou uma ação",det);
    if(v&&adPatch) await salvarVerba(v.id,{adiantamento:adPatch},"assumiu adiantamento com verba interna",[`Aprovado por ${adPatch.aprovadoPor}`,`Na campanha ${c.nome}`]);
    if(v&&virouFeita&&a.pagoPor==="verba"){
      if(!v.executadaEm) await salvarVerba(v.id,{executadaEm:a.data||hoje()},"usou a verba e marcou a campanha como executada",[`${brl(a.custo)} · ${a.tipo} · campanha ${c.nome}`]);
      else await addHist(v.id,"usou a verba",[`${brl(a.custo)} · ${a.tipo} · campanha ${c.nome}`]);
    }
    S.acaoEdit=null;S.dirty=false;toast("Ação salva");S.modal.keep=true;renderModal();
  }catch(e){const er=$("#aErr");if(er)er.textContent=errMsg(e);else toast(errMsg(e),true);}
}

async function salvarCiclo(f){
  const a=[f.a0.value,f.a1.value].filter(Boolean);

  else if(a==="delEvt"){const f=t.closest("form");if(!f.querySelector("[name=certeza]").checked){toast("Marque a caixa para confirmar a exclusão.",true);return;}
    const e=S.eventos.find(x=>x.id===id);try{await S.db.doc("eventos/"+id).delete();await addHist("","excluiu um evento do calendário",[e?e.titulo:""],e?e.titulo:"");toast("Evento excluído");fecharModal();}catch(err){toast(errMsg(err),true)}}
  else if(a==="baixarRel"){const v=verba(id);if(v)baixarRelatorio(v);}
  else if(a==="vview"){S.vview=t.dataset.k;renderMain();}
  else if(a==="sort"){const k=t.dataset.k;S.sort=S.sort.k===k?{k,dir:S.sort.dir==="asc"?"desc":"asc"}:{k,dir:(k==="prom"||k==="receb"||k==="usado")?"desc":"asc"};renderMain();}
  else if(a==="buscaForn"){S.fornBusca=t.dataset.k;S.fornFaixa="";if(location.hash==="#fornecedores")renderMain();else location.hash="#fornecedores";}
  else if(a==="goAlertas"){if(S.view!=="painel"){location.hash="#painel";setTimeout(()=>{const el=$("#alertas");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},60);}else{const el=$("#alertas");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}}
  else if(a==="abrirCamp")abrirModal({tipo:"camp",id});
  else if(a==="fechar")fecharModal();
  else if(a==="novaVerba")abrirModal({tipo:"verbaForm"});
  else if(a==="editVerba")abrirModal({tipo:"verbaForm",id});
  else if(a==="cancelarEdit")abrirModal({tipo:"verba",id});
  else if(a==="novaCamp")abrirModal({tipo:"campForm",ciclo:t.dataset.ciclo||""});
  else if(a==="editCamp")abrirModal({tipo:"campForm",id});
  else if(a==="novoForn")abrirModal({tipo:"forn"});
  else if(a==="editForn")abrirModal({tipo:"forn",id});
  else if(a==="editCiclo")abrirModal({tipo:"ciclo",id});
  else if(a==="col"){S.col=t.dataset.k;renderMain();}
  else if(a==="limparFil"){S.fil={forn:"",ciclo:"",tipo:"",area:""};renderMain();}
  else if(a==="faixa"){S.fornFaixa=t.dataset.k;renderMain();}
  else if(a==="campFil"){S.campFil=t.dataset.k;renderMain();}
  else if(a==="addRow"){const k=t.dataset.k;const box=$("#rows"+({deg:"Deg",cp:"Cp",lk:"Lk",ft:"Ft",ef:"Ef"})[k]);box.insertAdjacentHTML("beforeend",k==="deg"?degRow({}):k==="cp"?cpRow({}):lkRow({}));S.dirty=true;$("input",box.lastElementChild).focus();}
  else if(a==="delRow"){t.closest(".rowi").remove();S.dirty=true;}
  else if(a==="addAcao"){S.acaoEdit={mes:+t.dataset.mes,aid:null};reabrirAcao();}
  else if(a==="editAcao"){S.acaoEdit={aid:id};reabrirAcao();}
  else if(a==="cancelAcao"){S.acaoEdit=null;S.dirty=false;m.keep=true;renderModal();}
  else if(a==="toggleAcao"){const c=camp(m.id);const old=(c.acoes||[]).find(x=>x.id===id);if(!old)return;
    const v=old.verbaId?verba(old.verbaId):null;const na={...old,status:old.status==="feita"?"planejada":"feita",data:old.data||hoje()};
    if(na.status==="feita"&&old.pagoPor==="verba"&&v&&!permitida(v)&&!adiant(v)){S.acaoEdit={aid:id,msg:"Pela regra, a verba ainda não pode pagar esta ação. Marque o adiantamento com verba interna e mude a situação para Feita."};reabrirAcao();return;}
    t.disabled=true;await gravarAcao(c,na,old,v,null);}
  else if(a==="delAcao"){const c=camp(m.id);const old=(c.acoes||[]).find(x=>x.id===id);try{await salvarCamp(c.id,{acoes:(c.acoes||[]).filter(x=>x.id!==id)},"excluiu uma ação",[old?old.tipo+" · "+brl(old.custo):""]);S.acaoEdit=null;S.dirty=false;toast("Ação excluída");m.keep=true;renderModal();}catch(err){toast(errMsg(err),true)}}
  else if(a==="linkVerba"){const sel=$("#linkVerbaSel");if(!sel||!sel.value)return;const c=camp(m.id);const v=verba(sel.value);try{await salvarCamp(c.id,{verbaIds:[...(c.verbaIds||[]),sel.value]},"ligou uma verba",[verbaNome(v)]);S.dirty=false;m.keep=true;renderModal();}catch(err){toast(errMsg(err),true)}}
  else if(a==="unlinkVerba"){const c=camp(m.id);if((c.acoes||[]).some(x=>x.verbaId===id)){toast("Há ações pagas com esta verba. Mude essas ações antes de desligar.",true);return;}
    try{await salvarCamp(c.id,{verbaIds:(c.verbaIds||[]).filter(x=>x!==id)},"desligou uma verba",[verbaNome(verba(id))]);m.keep=true;renderModal();}catch(err){toast(errMsg(err),true)}}
  else if(a==="delCamp"){const f=t.closest("form");if(!f.querySelector("[name=certeza]").checked){toast("Marque a caixa para confirmar a exclusão.",true);return;}
    const c=camp(id);try{await S.db.doc("campanhas/"+id).delete();await addHist("","excluiu a campanha",[c?c.nome:""],c?c.nome:"");toast("Campanha excluída");fecharModal();}catch(err){toast(errMsg(err),true)}}
  else if(a==="aprovar"){const p=S.pedidos[id];try{await S.db.doc("equipe/"+id).set({area:p.area,desde:new Date().toISOString()});await S.db.doc("pedidos/"+id).delete();await addHist("","confirmou o acesso de uma pessoa",[AREAS[p.area]],"Equipe");toast("Acesso confirmado");}catch(err){toast(errMsg(err),true)}}
  else if(a==="recusar"){try{await S.db.doc("pedidos/"+id).delete();toast("Pedido recusado");}catch(err){toast(errMsg(err),true)}}
  else if(a==="removerMembro"){try{await S.db.doc("equipe/"+id).delete();await addHist("","removeu uma pessoa da equipe",[],"Equipe");toast("Pessoa removida");}catch(err){toast(errMsg(err),true)}}
  else if(a==="addPessoa"){const ar=t.parentElement.querySelector("select").value;try{await S.db.doc("equipe/"+id).set({area:ar,desde:new Date().toISOString()});if(S.pedidos[id])await S.db.doc("pedidos/"+id).delete();await addHist("","adicionou uma pessoa à equipe",[AREAS[ar]],"Equipe");toast("Pessoa adicionada");$("#buscaRes").innerHTML="";$("#buscaPessoa").value="";}catch(err){toast(errMsg(err),true)}}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.fil){S.fil[t.dataset.fil]=t.value;renderMain();return;}
  if(t.dataset.calfil){S.calFil[t.dataset.calfil]=t.value;renderMain();return;}
  if(t.dataset.actChange==="areaMembro"){try{await S.db.doc("equipe/"+t.dataset.id).update({area:t.value});await addHist("","mudou a área de uma pessoa",["Nova área: "+AREAS[t.value]],"Equipe");toast("Área atualizada");}catch(err){toast(errMsg(err),true)}return;}
  const f=t.form;
  if(f&&f.id==="fVerba"){
    if(t.name==="apuracaoInicio"&&t.value&&!f.apuracaoFim.value)f.apuracaoFim.value=fimTrimestre(t.value);
    if(t.name==="cicloId"&&t.value&&!f.dataCampanha.value){const c=ciclo(t.value);if(c)f.dataCampanha.value=c.inicio;}
    if(t.name==="adiant"&&t.checked)f.aprov.focus();
    atualizaForm(f);}
  if(f&&f.id==="fAcao"){atualizaAcao(f);if(t.name==="adiant"&&t.checked)f.aprov.focus();}
  if(f&&f.id==="fCamp"&&t.name==="cicloId"&&t.value){const c=ciclo(t.value);if(c){f.inicio.value=c.inicio;f.fim.value=c.fim;$$("#fornChecks input").forEach(i=>i.checked=(c.ancoras||[]).includes(i.value)||i.checked);}}
  if(t.closest("#modal"))S.dirty=true;
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fornBusca"){S.fornBusca=t.value;const pos=t.selectionStart;renderMain();const n=$("#fornBusca");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}return;}
  if(t.id==="buscaPessoa"){buscarPessoa(t.value);return;}
  if(t.id==="gsearch"){buscaGlobal(t.value);return;}
  if(t.closest("#modal")){S.dirty=true;const f=t.form;if(f&&f.id==="fVerba"&&["valorPrometido","parteFixa","parteVariavel","meta"].includes(t.name))atualizaForm(f);if(f&&f.id==="fForn"&&t.name==="compras")$("#fxCalc").textContent=faixaDe(num(t.value));}
});
document.addEventListener("submit",async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="fVerba")await salvarVerbaForm(f);
  else if(f.id==="fForn")await salvarForn(f);
  else if(f.id==="fCiclo")await salvarCiclo(f);
  else if(f.id==="fCamp")await salvarCampForm(f);
  else if(f.id==="fAcao")await salvarAcao(f);
  else if(f.id==="fResult"){const c=camp(f.dataset.id);const r={vendasCiclo:num(f.vendasCiclo.value),media3m:num(f.media3m.value),obs:f.obs.value.trim()};
    const fotos=lerRows("rowsFt",o=>o.url?{titulo:o.titulo,url:safeUrl(o.url)}:null);
    try{await salvarCamp(c.id,{resultados:r,fotos},"lançou resultados",[`Vendas no ciclo ${brl(r.vendasCiclo)} · média anterior ${brl(r.media3m)} · ${fotos.length} link(s)`]);S.dirty=false;toast("Resultados salvos");S.modal.keep=true;renderModal();}catch(err){toast(errMsg(err),true)}}
  else if(f.id==="fEvt")await salvarEvento(f);
  else if(f.id==="fEvtRes")await salvarResEvento(f);
  else if(f.id==="fRelTxt"){const v=verba(f.dataset.id);const txt=f.txt.value.trim();if(!v)return;if((v.relatorioTexto||"")===txt){toast("Nada foi alterado");return;}
    try{await salvarVerba(v.id,{relatorioTexto:txt},"editou o texto do relatório de contrapartida",[]);S.dirty=false;toast("Texto salvo");S.modal.keep=true;renderModal();}catch(err){toast(errMsg(err),true)}}
  else if(f.id==="fPedido"){const ar=$("#pedArea").value;if(!ar)return;try{await S.db.doc("pedidos/"+S.uid).set({area:ar,em:new Date().toISOString()});toast("Pedido enviado");}catch(err){toast(errMsg(err),true)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const gr=$("#gres");if(gr&&!gr.hidden){gr.hidden=true;return;}if(S.modal&&!S.dirty)fecharModal();}});
document.addEventListener("focusout",e=>{if(e.target.id==="gsearch")setTimeout(()=>{const gr=$("#gres");if(gr&&!gr.contains(document.activeElement))gr.hidden=true;},180);});
document.addEventListener("focusin",e=>{if(e.target.id==="gsearch"&&e.target.value)buscaGlobal(e.target.value);});
(()=>{const st=document.createElement("style");st.textContent=REPORT_CSS;document.head.appendChild(st);})();
async function buscarPessoa(q){
  const box=$("#buscaRes");if(!box)return;
  if(!S.user||!q.trim()){box.innerHTML="";return;}
  const hits=await S.user.search(q);
  if($("#buscaPessoa").value!==q)return;
  box.innerHTML=hits.length?hits.map(p=>`<li><img alt="" src="${esc(p.avatarUrl)}"><span class="nm">${esc(p.name)}${S.equipe[p.id]?` <span class="muted small">já está como ${esc(AREAS[S.equipe[p.id].area])}</span>`:""}</span><select aria-label="Área">${AREAS_ATIVAS.map(k=>`<option value="${k}">${AREAS[k]}</option>`).join("")}</select><button class="btn pri sm" data-act="addPessoa" data-id="${esc(p.id)}">Adicionar</button></li>`).join(""):`<li class="muted">Ninguém encontrado. A pessoa precisa criar a conta e ser aprovada em Administração.</li>`;
  hits.forEach(p=>{S.prof[p.id]=p;});
}

boot();
</script>
