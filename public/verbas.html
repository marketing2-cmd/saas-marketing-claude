<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Verbas Contattos+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Identidade Contattos+: fundo branco, laranja da marca, preto e o vermelho do raio; fonte Poppins. Layout: app SaaS com menu lateral branco fixo (desktop) e barra inferior (celular); conteúdo em até 1240px; fichas em gaveta lateral. Tema claro único, por escolha da marca. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f6f6f6; --ink:#111111; --muted:#5e5e5e; --line:#e6e6e6;
  --side:#ffffff; --side-2:#fff1e8; --side-ink:#3a3a3a; --side-hi:#111111;
  --accent:#e8601c; --accent-ink:#ffffff; --accent-soft:#fff1e8; --brand:#ee6a23; --bolt:#df0800;
  --info:#111111; --info-soft:#efefef;
  --amber:#c2540f; --amber-soft:#fff4ec; --amber-strong:#ee6a23;
  --ok:#0c8a5c; --ok-soft:#e3f5ec; --warn:#c2540f; --warn-soft:#fff1e8; --crit:#d40d00; --crit-soft:#ffe8e5;
  --shadow:0 1px 2px rgba(17,17,17,.04),0 2px 6px rgba(17,17,17,.04);
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-family:var(--f-display);font-style:italic;font-size:1.55rem;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
h2{font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:-.005em}
h3{font-size:.92rem;font-weight:700}
a{color:var(--accent);text-underline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* casca do app */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--side-ink);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;
  padding-block:max(18px,env(safe-area-inset-top,0px)) 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}

.logo{display:flex;flex-direction:column;gap:6px;padding:4px 6px 14px;border-bottom:1px solid var(--line)}
.logo .brandlogo{width:170px;height:61px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.95rem;letter-spacing:-.03em}
.logo b{color:var(--side-hi);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase}
.logo small{font-size:.72rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .cap{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;padding:10px 10px 6px;color:#9a9a9a;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:.88rem}
.nav a:hover{background:var(--sunk);color:var(--side-hi)}
.nav a.on{background:var(--side-2);color:var(--side-hi);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav a.on svg{color:var(--brand)}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--sunk)}
.side-foot img{width:32px;height:32px;border-radius:50%}
.side-foot b{display:block;color:var(--side-hi);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot small{font-size:.75rem;color:var(--muted)}
.side-foot div{min-width:0}
.content{min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--brand) 0 70%,var(--bolt) 70% 100%) 1}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.topbar .ttl{margin-right:auto;min-width:0}
.topbar .ttl small{color:var(--muted);font-size:.82rem}
.mbrand{display:none}
main{padding-block:22px 64px;display:flex;flex-direction:column;gap:20px}
.bnav{display:none}

/* elementos */
.banner{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--ink);color:var(--surface)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--info);border-radius:3px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi .h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;font-weight:600}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi:first-child .ic{background:#111;color:#fff}
.kpi b{font-family:var(--f-display);font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi small{color:var(--muted);font-size:.78rem}
.gap{border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:center;background:var(--amber-soft);border:1px solid var(--amber-strong)}
.gap .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--amber)}
.gap .big{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:0}
.gap ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.gap li{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted)}
.gap li b{font-size:1rem;color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:10px;background:var(--sunk);cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.alert:hover{border-color:var(--line)}
.alert .ai{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--warn-soft);color:var(--warn)}
.alert.crit .ai{background:var(--crit-soft);color:var(--crit)}
.alert.info .ai{background:var(--info-soft);color:var(--info)}
.alert b{display:block;font-size:.88rem}
.alert span{font-size:.82rem;color:var(--muted)}

/* quadro */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date],input[type=month],input[type=url],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.colchips{display:none;gap:6px;overflow-x:auto;padding-bottom:4px}
.colchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;cursor:pointer}
.colchips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid var(--line)}
.col-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px 4px}
.col-h h3{font-size:.82rem}
.col-h .n{font-size:.72rem;color:var(--muted);background:var(--surface);border-radius:999px;padding:0 7px;border:1px solid var(--line)}
.col-h .t{margin-left:auto;font-size:.75rem;color:var(--muted)}
.col-h small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--info)}
.card-top{display:flex;gap:8px;align-items:baseline}
.card-top b{font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.card-top .v{margin-left:auto;font-weight:700;white-space:nowrap}
.card .sub{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* campanhas */
.cgroup{display:flex;flex-direction:column;gap:10px}
.cgroup-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cgroup-h h2{font-size:.95rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--accent)}
.ccard h3{font-size:1rem}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metrics div{display:flex;flex-direction:column;min-width:0}
.metrics span{font-size:.72rem;color:var(--muted)}
.metrics b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.layer.on{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.act.feita{background:var(--sunk)}
.act .t{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.act .m{font-size:.8rem;color:var(--muted);grid-column:1/-1;display:flex;gap:4px 12px;flex-wrap:wrap}
.act .b{display:flex;gap:6px;align-items:flex-start}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.7rem;color:var(--muted);font-weight:600;background:var(--sunk);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* gaveta */
.overlay{position:fixed;inset:0;background:rgba(7,12,20,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(700px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(880px,100%)}
.dr-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.dr-h .t{min-width:0;flex:1}
.dr-h h2{font-size:1.25rem;overflow-wrap:anywhere}
.dr-b{padding:18px 20px 48px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h3,.sec > h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:.74rem;color:var(--muted)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;list-style:none;padding:0;margin:0}
.steps li{font-size:.68rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:0}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.steps li.done::before{background:var(--accent)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur::before{background:var(--bolt)}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
.rule.ok{background:var(--ok-soft)} .rule.warn{background:var(--warn-soft)} .rule.crit{background:var(--crit-soft)}
.rule b{font-size:.92rem}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ck .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.ck .d svg{width:14px;height:14px}
.ck.on .d{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck b{display:block;font-size:.84rem}
.ck small{font-size:.75rem;color:var(--muted)}
.step{border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.step h3{color:var(--accent)}
.step .who{font-size:.78rem}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more summary{padding:11px 16px;cursor:pointer;font-weight:600;font-size:.88rem}
details.more > div{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem}
.hist li img{width:24px;height:24px;border-radius:50%;grid-row:span 3}
.hist .q{color:var(--muted);font-size:.76rem}
.hist ul{margin:2px 0 0;padding-left:16px;color:var(--muted)}
.links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.links a{overflow-wrap:anywhere}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:.86rem}
.mini li .v{margin-left:auto;font-weight:700}

/* formulários */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:.78rem;font-weight:600;color:var(--muted)}
.f > small{font-size:.74rem;color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fg .wide{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tipo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface)}
.tipo:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tipo b{display:block;font-size:.88rem}
.tipo small{color:var(--muted);font-size:.76rem}
.rows{display:flex;flex-direction:column;gap:6px}
.rowi{display:flex;gap:6px;align-items:center}
.rowi input{flex:1;min-width:0}
.rowi input.n{flex:0 0 80px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:3px}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;max-height:200px;overflow-y:auto;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.err{color:var(--crit);font-size:.84rem;font-weight:600}
.err:empty{display:none}
.formbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 0;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--crit);color:#fff}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--sunk);border-radius:10px}
.people img{width:28px;height:28px;border-radius:50%}
.people .nm{font-weight:600;margin-right:auto;min-width:0;overflow-wrap:anywhere}

/* barra superior: trilha, busca global e alertas */
.crumbs{font-size:.74rem;color:var(--muted);margin-bottom:2px;letter-spacing:.02em}
.crumbs span{margin:0 5px;opacity:.55}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search > svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.search input{padding-left:34px;width:300px;border-radius:9px;height:38px}
.gres{position:absolute;top:calc(100% + 6px);right:0;width:360px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(20,12,8,.16);padding:6px;z-index:50;display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.gres[hidden]{display:none}
.gres .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px;font-weight:700}
.gres button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;width:100%}
.gres button:hover,.gres button:focus-visible{background:var(--sunk)}
.gres b{font-size:.88rem}
.gres small{color:var(--muted);font-size:.76rem}
.gres .none{padding:12px 10px;color:var(--muted);font-size:.86rem}
.iconbtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn .dotn{position:absolute;top:-6px;right:-6px;background:var(--bolt);color:#fff;font-size:.64rem;font-weight:700;border-radius:999px;padding:1px 6px;border:2px solid var(--bg)}
.nav .badge.soft{background:#111;color:#fff}
.kpi .bar{margin-top:6px;height:4px}
.kpi .bar i{background:var(--accent)}
/* funil */
.fun-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:24px;align-items:stretch}
.fun-gap{background:var(--amber-soft);border:1px solid var(--amber-strong);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.fun-gap .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--amber)}
.fun-gap .big{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.02em;color:var(--bolt)}
.fun-gap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.fun-gap li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.fun-gap li b{color:var(--ink);font-weight:600}
.fun-bars{display:flex;flex-direction:column;justify-content:center;gap:14px}
.fb{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr) 44px;gap:14px;align-items:center}
.fb-l{display:flex;flex-direction:column;min-width:0}
.fb-l span{font-size:.78rem;color:var(--muted);font-weight:600}
.fb-l b{font-family:var(--f-display);font-size:1.05rem;font-weight:700;line-height:1.2}
.fb-t{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.fb-t i{display:block;height:100%;border-radius:7px}
.fb-t i.s0{background:#111} .fb-t i.s1{background:#f5a46e} .fb-t i.s2{background:var(--brand)} .fb-t i.s3{background:var(--bolt)}
.fb small{font-size:.8rem;color:var(--muted);text-align:right;font-weight:600}
/* lista, segmentos, resumos */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface);box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg svg.i{width:15px;height:15px}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
td .sub{font-size:.78rem;color:var(--muted);white-space:normal}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.rel-wrap{background:var(--sunk);border-radius:var(--r);padding:16px}
/* calendário anual */
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.tl{min-width:1000px;position:relative}
.tl-row{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--line);position:relative;z-index:1}
.tl-row:last-child{border-bottom:0}
.tl-lbl{padding:9px 14px;font-size:.82rem;min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.tl-lbl b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lbl small{color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;min-height:46px}
.tl-head .tl-track{min-height:34px}
.tl-head .tl-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tl-m{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:8px;font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

<script>
/* Verbas Contattos+ — adaptador para rodar fora do Claude.
 *
 * A página (artifacts/verbas/verbas.html) foi escrita para o runtime de artefatos do
 * Claude, que oferece window.claude.use("db") e window.claude.use("user"). Este arquivo
 * implementa essas mesmas duas interfaces em cima da rota /api/verbas (Supabase), para
 * que a página rode igual no app do Vercel. Atualiza os dados a cada 15 s e logo após
 * cada gravação. */
(function () {
  "use strict";
  const POLL_MS = 15000;
  const st = { docs: {}, me: null, people: [], loaded: false, listeners: new Set(), timer: null };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  function deepMerge(base, patch) {
    const out = { ...(isObj(base) ? base : {}) };
    for (const [k, v] of Object.entries(patch)) out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : v;
    return out;
  }
  function newId() {
    const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let s = ""; const r = crypto.getRandomValues(new Uint8Array(20));
    for (const b of r) s += a[b % a.length];
    return s;
  }

  async function refresh() {
    try {
      const r = await fetch("/api/verbas", { cache: "no-store", credentials: "same-origin" });
      if (r.status === 401) { location.href = "/login"; return; }
      if (r.status === 403) { location.href = "/pending"; return; }
      if (!r.ok) return;
      const txt = await r.text();
      if (st.loaded && txt === st.lastTxt) return; // nada mudou: não redesenha a tela
      st.lastTxt = txt;
      const j = JSON.parse(txt);
      const docs = {};
      for (const d of j.docs) (docs[d.collection] ||= {})[d.id] = d.data;
      st.docs = docs; st.me = j.me; st.people = j.people || []; st.loaded = true;
      notify();
    } catch (e) { /* sem rede: tenta de novo no próximo ciclo */ }
  }
  function notify() { for (const l of st.listeners) { try { l(); } catch (e) { console.error(e); } } }
  function schedule() {
    clearInterval(st.timer);
    st.timer = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, POLL_MS);
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });

  async function write(op, collection, id, data) {
    const coll = (st.docs[collection] ||= {});
    const before = coll[id];
    if (op === "set") coll[id] = clone(data);
    else if (op === "update") { if (!before) throw { code: "invalid_argument", message: "Documento não encontrado." }; coll[id] = deepMerge(before, clone(data)); }
    else delete coll[id];
    notify();
    let r;
    try {
      r = await fetch("/api/verbas", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ op, collection, id, data }) });
    } catch (e) { refresh(); throw { code: "unavailable", message: "Sem conexão." }; }
    if (!r.ok) {
      refresh();
      const code = r.status === 403 || r.status === 400 || r.status === 404 ? "invalid_argument" : r.status === 413 ? "invalid_argument" : "unavailable";
      throw { code, message: "Falha ao salvar (" + r.status + ")." };
    }
    refresh();
  }

  function snapDoc(id, data) {
    return { id, exists: data !== undefined, data: () => (data === undefined ? undefined : data), metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function cmp(a, op, b) {
    switch (op) {
      case "==": return a === b; case "!=": return a !== b; case "<": return a < b; case "<=": return a <= b;
      case ">": return a > b; case ">=": return a >= b; case "in": return Array.isArray(b) && b.includes(a);
      case "not-in": return Array.isArray(b) && !b.includes(a); case "array-contains": return Array.isArray(a) && a.includes(b);
      default: return false;
    }
  }
  function makeQuery(collection, wheres, order, lim) {
    const run = () => {
      let rows = Object.entries(st.docs[collection] || {}).filter(([, d]) => wheres.every(([f, op, v]) => cmp(d[f], op, v)));
      if (order) {
        const [f, dir] = order;
        rows.sort((x, y) => { const a = x[1][f], b = y[1][f]; if (a === undefined) return 1; if (b === undefined) return -1; return (a < b ? -1 : a > b ? 1 : 0) * (dir === "desc" ? -1 : 1); });
      } else rows.sort((x, y) => (x[0] < y[0] ? -1 : 1));
      if (lim) rows = rows.slice(0, lim);
      const docs = rows.map(([id, d]) => snapDoc(id, d));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      where: (f, op, v) => makeQuery(collection, [...wheres, [f, op, v]], order, lim),
      orderBy: (f, dir = "asc") => makeQuery(collection, wheres, [f, dir], lim),
      limit: (n) => makeQuery(collection, wheres, order, n),
      get: async () => { if (!st.loaded) await refresh(); return run(); },
      onSnapshot(next) {
        const l = () => { if (st.loaded) next(run()); };
        st.listeners.add(l); if (st.loaded) setTimeout(l, 0);
        return () => st.listeners.delete(l);
      },
    };
  }
  function docRef(collection, id) {
    return {
      id, path: collection + "/" + id,
      get: async () => { if (!st.loaded) await refresh(); return snapDoc(id, (st.docs[collection] || {})[id]); },
      set: (data) => write("set", collection, id, data),
      update: (data) => write("update", collection, id, data),
      delete: () => write("delete", collection, id),
      onSnapshot(next) {
        const l = () => { if (st.loaded) next(snapDoc(id, (st.docs[collection] || {})[id])); };
        st.listeners.add(l); if (st.loaded) setTimeout(l, 0);
        return () => st.listeners.delete(l);
      },
    };
  }
  function collRef(collection) {
    return Object.assign(makeQuery(collection, [], null, null), {
      path: collection,
      doc: (id) => docRef(collection, id || newId()),
      add: async (data) => { const ref = docRef(collection, newId()); await ref.set(data); return ref; },
    });
  }
  const db = {
    collection: (p) => { if (p.includes("/")) throw new TypeError("Caminho de coleção não suportado: " + p); return collRef(p); },
    doc: (p) => { const s = p.split("/"); if (s.length !== 2) throw new TypeError("Caminho de documento não suportado: " + p); return docRef(s[0], s[1]); },
  };

  /* pessoas: nome a partir do e-mail, avatar com iniciais */
  function nomeDe(email) {
    if (!email) return "";
    return email.split("@")[0].split(/[._-]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");
  }
  function corDe(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return "hsl(" + (h % 360) + " 55% 45%)"; }
  function avatarDe(id, name) {
    const ini = (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="32" fill="${corDe(id)}"/><text x="32" y="41" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">${ini.replace(/[<>&]/g, "")}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  function profile(id) {
    const p = st.people.find((x) => x.id === id);
    const name = p ? nomeDe(p.email) : "";
    return { id, name, email: p ? p.email : null, avatarUrl: avatarDe(id, name), color: corDe(id), isMe: !!st.me && st.me.id === id, guest: false };
  }
  const user = {
    async me() { if (!st.loaded) await refresh(); const p = profile(st.me ? st.me.id : ""); return { ...p, id: st.me ? st.me.id : null, isOwner: !!(st.me && st.me.isAdmin), canEdit: !!(st.me && st.me.isAdmin) }; },
    async id() { if (!st.loaded) await refresh(); return st.me ? st.me.id : null; },
    async isOwner() { if (!st.loaded) await refresh(); return !!(st.me && st.me.isAdmin); },
    async canEdit() { return this.isOwner(); },
    async can(name) { return name === "data.write" ? true : false; },
    async name() { const m = await this.me(); return m.name; },
    async profiles(ids) { if (!st.loaded) await refresh(); const out = {}; for (const id of [].concat(ids)) out[id] = profile(id); return out; },
    async search(q) {
      if (!st.loaded) await refresh();
      q = String(q || "").toLowerCase();
      return st.people.filter((p) => !q || p.email.toLowerCase().includes(q) || nomeDe(p.email).toLowerCase().includes(q)).slice(0, 8).map((p) => profile(p.id));
    },
  };

  window.claude = { use: async (name) => (name === "db" ? db : name === "user" ? user : null) };
  refresh(); schedule();
})();

</script>

function brlK(n){n=Number(n)||0;const a=Math.abs(n);
  if(a>=1e6) return "R$ "+(n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";
  if(a>=1e3) return "R$ "+Math.round(n/1e3).toLocaleString("pt-BR")+" mil";
  return brl(n)}
function num(s){if(typeof s==="number")return s;s=String(s||"").replace(/[R$\s%]/g,"");if(!s)return 0;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/\.(?=\d{3}(\D|$))/g,"");
  const n=parseFloat(s);return isFinite(n)?n:0}
function inMoney(n){return n?Number(n).toLocaleString("pt-BR",{maximumFractionDigits:2}):""}
function hoje(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dBR(iso){if(!iso)return "—";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m+"/"+y}
function dhBR(iso){if(!iso)return "";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function dias(a,b){return Math.round((Date.parse(String(b).slice(0,10))-Date.parse(String(a).slice(0,10)))/864e5)}
function fimTrimestre(iso){const [y,m,d]=iso.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1+3,d));dt.setUTCDate(dt.getUTCDate()-1);return dt.toISOString().slice(0,10)}
function mesBR(ym){if(!ym)return "";const [y,m]=ym.split("-");return MESES[+m-1]+"/"+y}
function faixaDe(v){v=+v||0;return v>=1e6?"A":v>=3e5?"B":v>=1e5?"C":"—"}
function safeUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function rid(){return Math.random().toString(36).slice(2,10)}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function toast(msg,bad){const t=$("#toast");t.innerHTML=`<div class="toast${bad?" bad":""}" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",bad?6000:2600)}
function errMsg(e){const c=e&&e.code;
  if(c==="invalid_argument")return "Não foi possível salvar: seu acesso não permite esta alteração. Fale com a gestora de marketing.";
  if(c==="quota_exceeded")return "O banco de dados está cheio. Fale com a gestora de marketing.";
  if(c==="resource_exhausted")return "Muitas alterações seguidas. Espere alguns segundos e tente de novo.";
  return "Não foi possível salvar agora. Verifique a conexão e tente de novo."}

/* ===================== dados derivados ===================== */
const forn = id=>S.fornecedores.find(f=>f.id===id);
const ciclo = id=>S.ciclos.find(c=>c.id===id);
const verba = id=>S.verbas.find(v=>v.id===id);
const camp = id=>S.campanhas.find(c=>c.id===id);
function fornNome(id){const f=forn(id);return f?f.nome:"Fornecedor removido"}
function cicloNome(id){const c=ciclo(id);if(!c)return "Sem ciclo";return "Ciclo "+c.numero+" · "+MESES[+c.inicio.slice(5,7)-1]+"–"+MESES[+c.fim.slice(5,7)-1]}
function verbaNome(v){if(!v)return "verba";return fornNome(v.fornecedorId)+(v.titulo?" · "+v.titulo:"")+" ("+brlK(v.valorPrometido)+")"}
function realizado(v){return (v.realizados||[]).reduce((s,r)=>s+(+r.valor||0),0)}
function temMeta(v){return v.tipo==="condicionada"||(+v.meta>0)}
function liberado(v){
  const fx=+v.parteFixa||0, vr=+v.parteVariavel||0, base=(fx||vr)?null:(+v.valorPrometido||0);
  if(!(+v.meta>0)) return base??(fx+vr);
  const at=realizado(v)/v.meta*100;
  const ds=(v.degraus||[]).filter(d=>+d.pct>0).sort((a,b)=>a.pct-b.pct);
  let lib=0; if(ds.length){for(const d of ds) if(at>=+d.pct) lib=+d.libera||0;} else lib=at>=100?100:0;
  return base!=null? base*lib/100 : fx+vr*lib/100}
function esperado(v){return +v.valorConfirmado||+v.valorPrometido||0}
function disponivel(v){return v.etapa==="recebida"?(+v.valorRecebido||0):v.etapa==="perdida"?0:esperado(v)}
function notaBonif(v){return (v.notas||[]).some(n=>n.tipo==="bonificacao")}
function permitida(v){
  if(v.tipo==="fixa"||v.tipo==="executada") return true;
  if(v.tipo==="condicionada") return v.etapa==="confirmada"||v.etapa==="recebida";
  if(v.tipo==="bonificacao") return v.etapa==="recebida"||notaBonif(v);
  return false}
function adiant(v){return !!(v.adiantamento&&v.adiantamento.marcado)}
function coluna(v){if(v.etapa==="perdida")return "perdida";if(v.comprovadaEm)return "comprovada";if(v.executadaEm)return "executada";return v.etapa||"negociada"}
function anoDe(v){const c=ciclo(v.cicloId);if(c)return c.ano;const d=v.previsaoEntrada||v.dataCampanha;return d?+d.slice(0,4):ANO}
/* uso da verba = ações de campanha pagas com ela */
function usos(v){const out=[];for(const c of S.campanhas)for(const a of (c.acoes||[]))if(a.pagoPor==="verba"&&a.verbaId===v.id)out.push({c,a});return out}
function usado(v){return usos(v).filter(x=>x.a.status==="feita").reduce((s,x)=>s+(+x.a.custo||0),0)}
function planejadoV(v){return usos(v).filter(x=>x.a.status!=="feita").reduce((s,x)=>s+(+x.a.custo||0),0)}
function campMetricas(c){
  const vs=(c.verbaIds||[]).map(verba).filter(Boolean);
  const disp=vs.reduce((s,v)=>s+disponivel(v),0);
  const ac=c.acoes||[];
  const custo=ac.reduce((s,a)=>s+(+a.custo||0),0);
  const usadoV=ac.filter(a=>a.status==="feita"&&a.pagoPor==="verba").reduce((s,a)=>s+(+a.custo||0),0);
  const feitas=ac.filter(a=>a.status==="feita").length;
  return {vs,disp,custo,usadoV,saldo:disp-usadoV,feitas,total:ac.length}}
function statusCampanha(v){
  if(v.etapa==="perdida") return {c:"", t:"Verba perdida"};
  if(v.comprovadaEm) return {c:"ok", t:"Contrapartida comprovada"};
  if(v.executadaEm) return {c:"info", t:"Campanha executada"};
  if(permitida(v)) return {c:"ok", t:"Campanha liberada"};
  if(adiant(v)) return {c:"warn", t:"Adiantamento: risco assumido"};
  return {c:"crit", t:v.tipo==="bonificacao"?"Campanha só após a nota":"Campanha só após a meta"}}

function pendencias(v){
  const out=[]; if(v.etapa==="perdida") return out;
  const e=v.etapa, f=forn(v.fornecedorId)||{};
  if(e==="negociada") out.push({area:"marketing", t:"Anexar o acordo e formalizar"});
  if(e==="formalizada"){ if(temMeta(v)) out.push({area:"compras", t:"Iniciar a apuração da meta"}); else out.push({area:"marketing", t:"Confirmar a liberação da verba"}); }
  else if(e==="apuracao"){
    const ult=(v.realizados||[]).map(r=>r.mes).sort().pop()||"";
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const mp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    if(ult<mp) out.push({area:"compras", t:"Lançar o realizado de "+mesBR(mp)});
    if(+v.meta>0 && realizado(v)>=v.meta) out.push({area:"marketing", t:"Meta batida: confirmar a verba"});
    else if(v.apuracaoFim && v.apuracaoFim<hoje()) out.push({area:"marketing", t:"Apuração encerrada: confirmar ou marcar como perdida"});
  }
  else if(e==="confirmada"){
    if(!v.repasse) out.push({area:"compras", t:"Negociar o pagamento no pedido"});
    out.push({area:"financeiro", t:v.tipo==="bonificacao"&&!notaBonif(v)?"Confirmar o recebimento da nota de bonificação":"Confirmar o recebimento"});
  }
  if(!v.executadaEm && permitida(v)) out.push({area:"marketing", t:"Usar a verba em uma campanha"});
  if(v.executadaEm && !v.comprovadaEm) out.push({area:"marketing", t:"Enviar o relatório de contrapartida"});
  return out}
function pendCampanhas(){
  const out=[], t=hoje();
  for(const c of S.campanhas){ if(c.status==="cancelada") continue;
    for(const a of (c.acoes||[])) if(a.status!=="feita"&&a.data&&a.data<t) out.push({c,a,t:"Ação com data vencida: marcar como feita ou reagendar"});
    if(c.status!=="concluida"&&c.fim&&c.fim<t&&!(c.resultados&&+c.resultados.vendasCiclo)) out.push({c,t:"Lançar o resultado de vendas do ciclo"});
  }
  return out}

function alertas(){
  const out=[], t=hoje();
  for(const v of S.verbas){
    if(v.etapa==="perdida") continue;
    if(v.etapa==="apuracao" && +v.meta>0 && v.apuracaoInicio && v.apuracaoFim){
      const tot=Math.max(1,dias(v.apuracaoInicio,v.apuracaoFim)), dec=dias(v.apuracaoInicio,t), frac=Math.min(1,dec/tot);
      if(frac>=.5){const esp=v.meta*frac, r=realizado(v);
        if(r<esp) out.push({sev:frac>=1?"crit":"warn", v, titulo:frac>=1?"Apuração encerrada abaixo da meta":"Meta em risco",
          texto:`Realizado ${brl(r)}, esperado ${brl(esp)} até hoje. ${pct(r,v.meta)}% da meta com ${Math.round(frac*100)}% do período.`});}
    }
    if(v.etapa==="confirmada" && v.previsaoEntrada && v.previsaoEntrada<t)
      out.push({sev:"crit", v, titulo:"Verba confirmada não entrou", texto:`Previsão era ${dBR(v.previsaoEntrada)}: ${dias(v.previsaoEntrada,t)} dias de atraso.`});
    if(!permitida(v) && !adiant(v)){
      if(!v.executadaEm && v.dataCampanha) out.push({sev:"warn", v, titulo:"Campanha marcada antes de a verba ser permitida", texto:`Campanha em ${dBR(v.dataCampanha)}. Regra: ${REGRA[v.tipo].toLowerCase()}.`});
      else if(planejadoV(v)>0) out.push({sev:"warn", v, titulo:"Ações planejadas com verba ainda não liberada", texto:`${brl(planejadoV(v))} em ações. Regra: ${REGRA[v.tipo].toLowerCase()}.`});
    }
    if(v.executadaEm && !v.comprovadaEm && dias(v.executadaEm,t)>15)
      out.push({sev:"warn", v, titulo:"Campanha sem relatório de contrapartida", texto:`Executada em ${dBR(v.executadaEm)}, há ${dias(v.executadaEm,t)} dias.`});
    const u=usado(v), d=disponivel(v);
    if(u>d+0.5) out.push({sev:"crit", v, titulo:"Uso acima da verba", texto:`Marketing usou ${brl(u)} de ${brl(d)} disponíveis.`});
  }
  return out.sort((a,b)=>(a.sev==="crit"?0:1)-(b.sev==="crit"?0:1))}

function area(){const e=S.equipe[S.uid];if(e&&e.area)return e.area;return S.isOwner?"marketing":null}
function pode(a){return S.canWrite!==false && !!S.db && PODE[a].includes(area())}
function nome(id){if(!id)return "—";const p=S.prof[id];return (p&&p.name)||(id===S.uid?"Você":"Pessoa sem nome")}
function avatar(id){const p=S.prof[id];return p?p.avatarUrl:""}
async function ensureProfiles(ids){
  if(!S.user) return;
  const miss=[...new Set(ids.filter(x=>typeof x==="string"&&x))].filter(id=>!(id in S.prof));
  if(!miss.length) return;
  miss.forEach(id=>S.prof[id]=null);
  try{const ps=await S.user.profiles(miss);Object.assign(S.prof,ps);}catch(e){}
  renderAll()}
function idsVisiveis(){
  const ids=[S.uid,...Object.keys(S.equipe),...Object.keys(S.pedidos)];
  for(const v of S.verbas){ids.push(v.criadoPor,v.atualizadoPor);Object.values(v.responsaveis||{}).forEach(x=>ids.push(x));if(v.adiantamento)ids.push(v.adiantamento.por);if(v.repasse)ids.push(v.repasse.por);(v.notas||[]).forEach(n=>ids.push(n.por));}
  for(const c of S.campanhas){ids.push(c.responsavel,c.criadoPor);}
  for(const e of S.eventos){ids.push(e.criadoPor);}
  S.feed.forEach(h=>ids.push(h.por));S.histV.forEach(h=>ids.push(h.por));
  return ids}
function membros(ar){return Object.entries(S.equipe).filter(([,e])=>e.area===ar).map(([id])=>id)}

async function addHist(verbaId, acao, detalhes, alvo, campanhaId, eventoId){
  try{await S.db.collection("historico").add({verbaId:verbaId||"", campanhaId:campanhaId||"", eventoId:eventoId||"", alvo:alvo||"", em:new Date().toISOString(), por:S.uid||"", acao, detalhes:detalhes||[]});}catch(e){}
}
async function salvarVerba(id, patch, acao, detalhes){
  patch.atualizadoEm=new Date().toISOString(); patch.atualizadoPor=S.uid||"";
  await S.db.doc("verbas/"+id).update(patch);
  await addHist(id, acao, detalhes);
}
async function salvarCamp(id, patch, acao, detalhes){
  patch.atualizadoEm=new Date().toISOString(); patch.atualizadoPor=S.uid||"";
  await S.db.doc("campanhas/"+id).update(patch);
  await addHist("", acao, detalhes, "", id);
}

/* ===================== inicialização ===================== */
async function boot(){
  route(); renderAll();
  window.addEventListener("hashchange",()=>{route();renderHeader();renderMain();window.scrollTo(0,0);});
  const c=window.claude;
  if(!c||!c.use){S.noDb=true;renderAll();return;}
  const timer=setTimeout(()=>{S.slow=true;renderMain();},10000);
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  S.db=db; S.user=user;
  if(user){
    const me=await user.me(); S.me=me; S.uid=me.id; S.isOwner=me.isOwner;
    try{S.canWrite=await user.can("data.write");}catch(e){S.canWrite=null}
  }
  if(!db){clearTimeout(timer);S.noDb=true;renderAll();return;}
  const done=k=>{S.ok[k]=true;if(["fornecedores","ciclos","verbas","equipe"].every(x=>S.ok[x])){clearTimeout(timer);S.slow=false;}};
  const onErr=k=>e=>{done(k);if(e&&e.code!=="revoked")toast("Não foi possível carregar "+k+". Recarregue a página.",true);renderAll();};
  db.collection("fornecedores").onSnapshot(s=>{S.fornecedores=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.compras2026||0)-(a.compras2026||0));if(!s.metadata.fromCache)done("fornecedores");renderAll();},onErr("fornecedores"));
  db.collection("ciclos").onSnapshot(s=>{S.ciclos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ano-b.ano)||(a.numero-b.numero));if(!s.metadata.fromCache)done("ciclos");renderAll();},onErr("ciclos"));
  db.collection("verbas").onSnapshot(s=>{S.verbas=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)done("verbas");afterData();},onErr("verbas"));
  db.collection("eventos").onSnapshot(s=>{S.eventos=s.docs.map(d=>({id:d.id,...d.data()}));afterData();},()=>{});
  db.collection("campanhas").onSnapshot(s=>{S.campanhas=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)done("campanhas");afterData();},onErr("campanhas"));
  db.collection("equipe").onSnapshot(s=>{S.equipe=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(!s.metadata.fromCache){done("equipe");ownerSelf();}afterData();},onErr("equipe"));
  db.collection("pedidos").onSnapshot(s=>{S.pedidos=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));afterData();},()=>{});
  db.collection("historico").orderBy("em","desc").limit(40).onSnapshot(s=>{S.feed=s.docs.map(d=>({id:d.id,...d.data()}));afterData();},()=>{});
}

}

function bannerHtml(){
  let h="";
  if(S.noDb) return `<div class="banner warn">Não foi possível conectar ao banco de dados. Recarregue a página.</div>`;
  if(S.slow) h+=`<div class="banner warn">Os dados ainda não carregaram. Verifique a conexão; a página continua tentando.</div>`;
  if(S.db && S.uid && !area() && S.ok.equipe){
    const ped=S.pedidos[S.uid];
    if(S.canWrite===false) h+=`<div class="banner">Você está no modo de visualização.</div>`;

    ${kpi("entrada","Recebido",recebido,pct(recebido,prometido)+"% do prometido",pct(recebido,prometido))}

  </div>

        <ul><li>Perdido<b>${brl(perdido)}</b></li><li>Confirmado, falta entrar<b>${brl(aReceber)}</b></li><li>Em negociação ou apuração<b>${brl(emAndamento)}</b></li><li>Recebido e ainda não usado<b>${brl(naoUsado)}</b></li></ul></div>
      <div class="fun-bars">${[["Prometido",prometido],["Confirmado",confirmado],["Recebido",recebido],["Usado em campanha",usadoT]].map(([n,val],i)=>`<div class="fb"><div class="fb-l"><span>${n}</span><b>${brl(val)}</b></div><div class="fb-t"><i class="s${i}" style="width:${prometido?Math.min(100,val/prometido*100):0}%"></i></div><small>${pct(val,prometido)}%</small></div>`).join("")}</div>
    </div>
  </section>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Entradas por mês</h2><div class="legend spacer"><span><i style="background:var(--info-soft);outline:1.5px solid var(--info)"></i>Previsto</span><span><i style="background:var(--accent)"></i>Recebido</span></div></div>
      <div class="chart">${chartHtml(vs)}</div>
    </section>
    <section class="panel">
      <div class="panel-h" id="alertas"><h2>Alertas</h2><span class="pill ${al.some(a=>a.sev==="crit")?"crit":al.length?"warn":"ok"}">${al.length}</span></div>
      ${al.length?`<ul class="alist">${al.map(a=>`<li><button class="alert ${a.sev}" data-act="abrir" data-id="${a.v.id}"><span class="ai">${ico("alerta")}</span><div><b>${esc(a.titulo)} · ${esc(fornNome(a.v.fornecedorId))}</b><span>${esc(a.texto)}</span></div></button></li>`).join("")}</ul>`
        :`<div class="empty">Nenhum alerta. Meta em risco, verba atrasada, campanha antes da hora, uso acima da verba e relatório pendente aparecem aqui.</div>`}

  if(ar && ar!=="diretoria"){

    for(const v of S.verbas) for(const p of pendencias(v)) if(p.area===ar) minhas.push({tipo:"v",id:v.id,t:p.t,s:fornNome(v.fornecedorId)+(v.titulo?" · "+v.titulo:"")+" · "+brl(v.valorPrometido)});
    if(ar==="marketing") for(const e of S.eventos) if(e.status!=="cancelado"&&!temResEvt(e)&&(e.status==="realizado"||(e.fim||e.inicio)<hoje())) minhas.push({tipo:"e",id:e.id,t:"Lançar o resultado do evento",s:e.titulo+" · "+dBR(e.inicio)});
    if(ar==="marketing") for(const p of pendCampanhas()) minhas.push({tipo:"c",id:p.c.id,t:p.t,s:p.c.nome+(p.a?" · "+p.a.tipo+" em "+dBR(p.a.data):"")});
    h+=`<section class="panel"><div class="panel-h"><h2>Suas pendências</h2><span class="pill info">${esc(AREAS[ar])}</span><span class="pill">${minhas.length}</span></div>

        :`<div class="empty">Nada pendente para ${esc(AREAS[ar])} agora.</div>`}</section>`;
  }
  if(!S.verbas.length && S.ok.verbas){
    h+=`<div class="empty">Nenhuma verba cadastrada ainda. ${pode("criar")?`<br><br><button class="btn pri" data-act="novaVerba">Cadastrar a primeira verba</button>`:"O Marketing cadastra as verbas negociadas."}</div>`;

function kpi(ic,l,v,s,p){return `<div class="kpi"><div class="h"><span class="ic">${ico(ic)}</span>${l}</div><b>${brl(v)}</b><small>${esc(s)}</small>${p!=null?`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`:""}</div>`}
function niceMax(m){if(m<=0)return 1;const p=10**Math.floor(Math.log10(m)),f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chartHtml(vs){
  const prev=Array(12).fill(0), rec=Array(12).fill(0);
  for(const v of vs){
    if(v.etapa!=="perdida"&&v.previsaoEntrada&&+v.previsaoEntrada.slice(0,4)===ANO) prev[+v.previsaoEntrada.slice(5,7)-1]+=esperado(v);
    if(v.etapa==="recebida"&&v.dataEntrada&&+v.dataEntrada.slice(0,4)===ANO) rec[+v.dataEntrada.slice(5,7)-1]+=(+v.valorRecebido||0);
  }
  const mx=Math.max(...prev,...rec);
  if(mx<=0) return `<div class="empty">O gráfico aparece quando as verbas tiverem previsão de entrada em ${ANO}.</div>`;
  const top=niceMax(mx), W=640, H=230, L=64, B=26, T=10, cw=(W-L-8)/12, bw=Math.min(16,cw/2-3);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g="";
  [0,.5,1].forEach(f=>{const yy=y(top*f);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(brlK(top*f))}</text>`;});
  const tm=new Date().getFullYear()===ANO?new Date().getMonth():-1;
  for(let i=0;i<12;i++){
    const cx=L+cw*i+cw/2;
    if(prev[i]>0){const yy=y(prev[i]);g+=`<rect x="${cx-bw-1}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="3" fill="var(--info-soft)" stroke="var(--info)" stroke-width="1.2"><title>${MESES[i]}: previsto ${brl(prev[i])}</title></rect>`;}
    if(rec[i]>0){const yy=y(rec[i]);g+=`<rect x="${cx+1}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="3" fill="var(--accent)"><title>${MESES[i]}: recebido ${brl(rec[i])}</title></rect>`;}
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${i===tm?"var(--ink)":"var(--muted)"}" font-weight="${i===tm?700:400}">${MESES[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Previsto e recebido por mês">${g}</svg>`}

    <select data-fil="area" aria-label="Área com pendência"><option value="">Pendência de qualquer área</option>${AREAS_FLUXO.map(a=>`<option value="${a}" ${f.area===a?"selected":""}>Pendente com ${AREAS[a]}</option>`).join("")}</select>

  h+=`<div class="board">${COLS.map(c=>{const l=by[c.k];const tot=l.reduce((s,v)=>s+(+v.valorPrometido||0),0);

      ${l.length?l.map(cardHtml).join(""):`<div class="empty small">Nenhuma verba</div>`}</section>`}).join("")}</div>`;
  return h}
function cardHtml(v){
  const st=statusCampanha(v), n=alertas().filter(a=>a.v.id===v.id).length;
  let bar="";
  if(temMeta(v)&&+v.meta>0&&v.etapa!=="perdida"&&!v.executadaEm){const p=Math.min(100,realizado(v)/v.meta*100);bar=`<div class="bar ${p>=100?"ok":""}" title="${Math.round(p)}% da meta"><i style="width:${p}%"></i></div><div class="sub">Meta ${pct(realizado(v),v.meta)}% · ${brlK(realizado(v))} de ${brlK(v.meta)}</div>`;}
  const u=usado(v),d=disponivel(v);
  if(u>0){const p=Math.min(100,d>0?u/d*100:100);bar+=`<div class="bar ${u>d?"crit":"ok"}"><i style="width:${p}%"></i></div><div class="sub">Usado ${brlK(u)} de ${brlK(d)}</div>`;}
  const falta=(v.executadaEm&&v.etapa!=="recebida"&&v.etapa!=="perdida")?`<span class="pill warn">Verba ainda não entrou</span>`:"";
  const ctrl=(v.repasse?`<span class="pill">Pagamento ✓</span>`:"")+((v.notas||[]).length?`<span class="pill">Nota ✓</span>`:"");
  return `<button class="card" data-act="abrir" data-id="${v.id}">

    ${bar}
    <div class="chips"><span class="pill dot ${st.c}">${esc(st.t)}</span>${falta}${ctrl}${n?`<span class="pill crit">${n} alerta${n>1?"s":""}</span>`:""}${v.etapa==="perdida"&&v.motivoPerda?`<span class="pill">${esc(MOTIVOS[v.motivoPerda])}</span>`:""}</div>
  </button>`}

function listaHtml(vs){

function relatorioDados(v){
  const cs=S.campanhas.filter(c=>(c.verbaIds||[]).includes(v.id));
  const acoes=[];for(const c of cs)for(const a of (c.acoes||[]))if(a.status==="feita")acoes.push({c,a});

  return {cs,acoes,ini,fim}}
function relatorioHtml(v){
  const f=forn(v.fornecedorId)||{}, {cs,acoes,ini,fim}=relatorioDados(v), ci=ciclo(v.cicloId);
  let h=`<div class="report"><div class="rh"><span class="brandlogo" role="img" aria-label="Contattos+"></span><div class="rt"><h1>Relatório de contrapartida</h1><div><b>${esc(f.nome||"")}</b>${v.titulo?" · "+esc(v.titulo):""}</div><div class="rsub">${ini?dBR(ini)+" a "+dBR(fim):""}${ci?" · "+esc(cicloNome(ci.id))+" "+ci.ano:""}</div></div></div>`;

  if(v.relatorioTexto) h+=`<h2>Resumo</h2>${v.relatorioTexto.split(/\n{2,}/).map(t=>`<p>${esc(t).replace(/\n/g,"<br>")}</p>`).join("")}`;

    ${ed?`<details class="more" ${!temResEvt(e)&&(e.status==="realizado"||(e.fim||e.inicio)<hoje())?"open":""}><summary>${temResEvt(e)?"Atualizar":"Lançar"} resultados</summary><div><form id="fEvtRes" data-id="${e.id}" class="fg" novalidate>
      <label class="f"><span>Público presente</span><input type="text" inputmode="numeric" name="publico" value="${esc(r.publico||"")}"></label>

      <label class="f"><span>Investimento realizado (R$)</span><input type="text" inputmode="decimal" name="investimento" value="${inMoney(r.investimento||e.investimento)}"></label>

    <div class="f wide"><span>Fornecedores que participam</span><div class="checkgrid" id="fornChecks">${fs.map(f=>`<label class="check"><input type="checkbox" value="${f.id}" ${(e.fornecedorIds||[]).includes(f.id)?"checked":""}> ${esc(f.nome)}</label>`).join("")}</div></div>

  </div><div class="err" id="fErr" role="alert"></div><div class="formbar"><button type="button" class="btn" data-act="${novo?"fechar":"abrirEvt"}" data-id="${e.id||""}">Cancelar</button><button class="btn pri">${novo?"Adicionar ao calendário":"Salvar"}</button></div></form>`;

async function salvarEvento(f){
  const err=$("#fErr");err.textContent="";
  const d={titulo:f.titulo.value.trim(),tipo:f.tipo.value,inicio:f.inicio.value,fim:f.fim.value,status:f.status.value,local:f.local.value.trim(),
    investimento:num(f.investimento.value),publicoEsperado:Math.round(num(f.publicoEsperado.value))||0,descricao:f.descricao.value.trim(),
    fornecedorIds:$$("#fornChecks input:checked").map(i=>i.value),links:lerRows("rowsLk",o=>o.url?{titulo:o.titulo,url:safeUrl(o.url)}:null)};
  if(!d.titulo) return err.textContent="Dê um nome ao evento.";
  if(!d.tipo) return err.textContent="Escolha o tipo.";
  if(!d.inicio) return err.textContent="Informe a data de início.";
  if(d.fim&&d.fim<d.inicio) return err.textContent="A data de fim está antes do início.";
  if(!d.fim) d.fim=d.inicio;
  const id=f.dataset.id, now=new Date().toISOString();
  try{
    if(!id){const ref=S.db.collection("eventos").doc();
      await ref.set({...d,resultados:{},criadoEm:now,criadoPor:S.uid||"",atualizadoEm:now,atualizadoPor:S.uid||""});
      await addHist("","adicionou ao calendário",[`${d.titulo} · ${TIPOS_EVT[d.tipo]} · ${periodo(d.inicio,d.fim)}`],"","",ref.id);
      toast("Evento adicionado ao calendário");S.dirty=false;abrirModal({tipo:"evento",id:ref.id});}
    else{await S.db.doc("eventos/"+id).update({...d,atualizadoEm:now,atualizadoPor:S.uid||""});
      await addHist("","editou o evento",[`${d.titulo} · ${STATUS_E[d.status][0]} · ${periodo(d.inicio,d.fim)}`],"","",id);
      toast("Evento salvo");S.dirty=false;abrirModal({tipo:"evento",id});}
  }catch(x){err.textContent=errMsg(x);}
}
async function salvarResEvento(f){
  const e=S.eventos.find(x=>x.id===f.dataset.id);if(!e)return;
  const r={publico:Math.round(num(f.publico.value))||0,contatos:Math.round(num(f.contatos.value))||0,vendas:num(f.vendas.value),investimento:num(f.investimento.value),
    avaliacao:f.avaliacao.value.trim(),fotos:lerRows("rowsEf",o=>o.url?{titulo:o.titulo,url:safeUrl(o.url)}:null)};
  const patch={resultados:r,atualizadoEm:new Date().toISOString(),atualizadoPor:S.uid||""};
  const ck=f.querySelector("[name=realizado]"); if(ck&&ck.checked) patch.status="realizado";
  try{await S.db.doc("eventos/"+e.id).update(patch);
    await addHist("","lançou os resultados do evento",[`Público ${r.publico} · contatos ${r.contatos} · vendas ${brl(r.vendas)} · investimento ${brl(r.investimento)}`],"","",e.id);
    S.dirty=false;toast("Resultados salvos");S.modal.keep=true;renderModal();}
  catch(x){toast(errMsg(x),true)}
}

/* ---------- campanhas ---------- */
function campanhasHtml(){
  const fil=S.campFil;
  const cs=S.campanhas.filter(c=>!fil||c.status===fil);
  let h=`<div class="filters">${[["","Todas"],...Object.entries(STATUS_C).map(([k,[n]])=>[k,n])].map(([k,n])=>`<button class="btn sm ${fil===k?"pri":""}" data-act="campFil" data-k="${k}">${n}</button>`).join("")}</div>`;
  if(!S.campanhas.length) return h+`<div class="empty">Nenhuma campanha ainda.<br>Cada campanha liga um ciclo, os fornecedores-âncora, as verbas e as ações de mês 1 (lançamento) e mês 2 (aceleração e fechamento) nas 3 camadas: vendedor, balcão e eletricista.${pode("campanha")?`<br><br><button class="btn pri" data-act="novaCamp">Criar a primeira campanha</button>`:""}</div>`;
  const grupos=[...S.ciclos.map(c=>({k:c.id,n:cicloNome(c.id)+" "+c.ano,ancoras:c.ancoras||[]})),{k:"",n:"Campanhas fora de ciclo",ancoras:[]}];
  for(const g of grupos){
    const l=cs.filter(c=>(c.cicloId||"")===g.k).sort((a,b)=>String(a.inicio).localeCompare(String(b.inicio)));
    if(!l.length&&!g.k) continue;
    h+=`<section class="cgroup"><div class="cgroup-h"><h2>${esc(g.n)}</h2>${g.ancoras.length?`<span class="muted small">Âncoras: ${esc(g.ancoras.map(fornNome).join(" + "))}</span>`:""}</div>
      ${l.length?`<div class="cgrid">${l.map(campCard).join("")}</div>`:`<div class="empty small">Nenhuma campanha neste ciclo.${pode("campanha")?` <button class="btn sm" data-act="novaCamp" data-ciclo="${g.k}">+ Criar</button>`:""}</div>`}</section>`;
  }
  return h}
function camadasHtml(acoes,mes){
  const l=(acoes||[]).filter(a=>!mes||a.mes===mes);
  return `<div class="layers">${Object.entries(CAMADAS).map(([k,n])=>{const on=l.some(a=>a.camada===k);return `<span class="layer ${on?"on":""}">${on?"✓ ":""}${n}</span>`}).join("")}</div>`}
function campCard(c){
  const m=campMetricas(c), [sn,sc]=STATUS_C[c.status||"planejada"];
  const p=m.disp>0?Math.min(100,m.usadoV/m.disp*100):0;
  return `<button class="ccard" data-act="abrirCamp" data-id="${c.id}">
    <div class="row"><h3>${esc(c.nome)}</h3><span class="pill dot ${sc} spacer">${sn}</span></div>
    <div class="muted small">${dBR(c.inicio)} a ${dBR(c.fim)}${(c.fornecedorIds||[]).length?" · "+esc(c.fornecedorIds.map(fornNome).join(" + ")):""}</div>
    <div class="metrics"><div><span>Verba disponível</span><b>${brlK(m.disp)}</b></div><div><span>Usado</span><b>${brlK(m.usadoV)}</b></div><div><span>Saldo</span><b style="color:${m.saldo<0?"var(--crit)":"inherit"}">${brlK(m.saldo)}</b></div></div>
    <div class="bar ${m.usadoV>m.disp?"crit":"ok"}"><i style="width:${p}%"></i></div>
    ${camadasHtml(c.acoes)}
    <div class="muted small">${m.feitas} de ${m.total} ações feitas</div>
  </button>`}
